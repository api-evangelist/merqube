      - RT
      - EOD_AND_RT
      type: string
    PortfolioStatus:
      description: 'Indicates the status of a target portfolio.  A portfolio can only be used in an index if status is `FINAL` * `PENDING_VALIDATION` - Custom validation is necessary, and is queued up * `FAILED_VALIDATION` - Custom validation has failed. * `PASSED_VALIDATION` - Custom validation has succeeded. The portfolio must now be selected * `SELECTED` - Selected for usage on a date, but has not yet been locked in / finalized * `UNSELECTED` - Was previously selected, but a newer portfolio has replaced it for that date * `FINAL` - This portfolio can now be used for the given date. * `DELETED` - This portfolio has been deleted or rejected for usage.

        '
      enum:
      - PENDING_VALIDATION
      - FAILED_VALIDATION
      - PASSED_VALIDATION
      - SELECTED
      - UNSELECTED
      - FINAL
      - DELETED
      title: PortfolioStatus
      type: string
    SecapiBasketPosition:
