      - format: date-time
        type: string
      - format: date
        type: string
      - pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(?:[ T][0-9]{2}:[0-9]{2}:[0-9]{2})?(?:[.][0-9]{1,6})?$
        type: string
      example:
      - '2021-01-01'
      - '2021-01-01T01:01:01'
      - 2021-01-01T01:01:01.zzzzz
    IsoTS_2:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}(T|\s)\d{2}:\d{2}:\d{2}(\.\d{6})?$
      example: 2022-01-02 01:02:03
    IsoDate_2:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}
      example: 2000-01-04
    BaseDate_2:
      description: the date that the index has level 'base_value'
      type: string
      pattern: ^[0-9]{4}[-/][0-9]{2}[-/][0-9]{2}
      example: 2000-01-04
    CrudExtra_2:
      type: object
