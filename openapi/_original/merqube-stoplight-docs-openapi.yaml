          type: string
    MerqubeIndexPosition:
      description: A basket position that uses custom metrics from merqube data source
      allOf:
        - $ref: '#/components/schemas/BasketPosition'
        - $ref: '#/components/schemas/MerqubeIndexSpecific'
    MerqubeIndexSpecific:
      type: object
      additionalProperties: false
      properties:
        metric_name:
          type: string
    PortfolioUom:
      type: string
      enum:
        - SHARES
        - WEIGHT
      title: PortfolioUom
      description: 'Used to indicate if portfolio amounts are absolute or relative. weight indicates portfolio amounts are relative weights units indicates portfolio amounts are absolute values, e.g. shares or number of contracts'
    PortfolioStatus:
      type: string
      enum:
        - PENDING_VALIDATION
        - FAILED_VALIDATION
        - PASSED_VALIDATION
        - SELECTED
        - UNSELECTED
        - FINAL
        - DELETED
      title: PortfolioStatus
      description: |
        Indicates the status of a target portfolio.  A portfolio can only be used in an index if status is `FINAL` * `PENDING_VALIDATION` - Custom validation is necessary, and is queued up * `FAILED_VALIDATION` - Custom validation has failed. * `PASSED_VALIDATION` - Custom validation has succeeded. The portfolio must now be selected * `SELECTED` - Selected for usage on a date, but has not yet been locked in / finalized * `UNSELECTED` - Was previously selected, but a newer portfolio has replaced it for that date * `FINAL` - This portfolio can now be used for the given date. * `DELETED` - This portfolio has been deleted or rejected for usage.
    BasketPortfolioPatchIn:
      type: object
      description: |
        Input data for updating an existing target portfolio
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PortfolioStatus'
        status_change_reason:
          type: string
    SecurityMetrics:
      type: object
      properties:
        eff_ts:
          $ref: '#/components/schemas/MerqTimestamp'
        id:
          type: string
          examples:
            - 0000699a-fcd7-45d4-8ce4-064a4ffeced0
        metric:
          type: string
          examples:
            - Level
        source:
          type: string
          examples:
            - some_gcp_feed
        prov_ts:
          $ref: '#/components/schemas/MerqTimestamp'
        value:
          anyOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: array
            - type: object
      required:
        - eff_ts
        - id
        - metric
        - prov_ts
        - value
