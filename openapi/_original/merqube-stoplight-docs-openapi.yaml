        - $ref: '#/components/schemas/RicEquityPosition'
        - $ref: '#/components/schemas/FsymEquityPosition'
        - $ref: '#/components/schemas/OptionPosition'
        - $ref: '#/components/schemas/FuturesPosition'
        - $ref: '#/components/schemas/SecapiBasketPosition'
        - $ref: '#/components/schemas/MerqubeIndexPosition'
