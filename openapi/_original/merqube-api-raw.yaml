  parameters:
    dataCollectionsNameParam:
      name: name
      in: query
      description: Name of the data collection to query
      required: true
      schema:
        type: string
    sectypeParam:
      name: type
      in: path
      description: the type of security (futures_root, intraday_index etc)
      schema:
        type: string
      required: true
    providerParam:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Provider'
    startDateParam:
      name: start_date
      in: query
      description: Start date for the results/computation
      required: false
      schema:
        $ref: '#/components/schemas/MerqTimestamp'
    endDateParam:
      name: end_date
      in: query
      description: End date for the results/computation
      required: false
      schema:
        $ref: '#/components/schemas/MerqTimestamp'
    secnameParam:
      name: secname
      in: path
      description: name of the security for which the data is requested
      required: true
      schema:
        type: string
    preferReadReplicaParam:
      name: prefer_read_replica
      in: query
      description: Opt into replica/cache-tolerant reads. Defaults to false, which keeps DB reads on the writer and bypasses SecAPI full-query caches for stronger read-after-write consistency.
      required: false
      schema:
        type: boolean
        default: false
    identifierParam:
      name: identifier_uuid
      in: path
      description: identifier UUID
      required: true
      schema:
        type: string
    identifierNameParam:
      name: identifier_name
      in: path
      description: identifier name
      required: true
      schema:
        type: string
    fsymIdParam:
      name: fsym_id
      in: path
      description: fsym id
      required: true
      schema:
        type: string
    indexUuidsParam:
      name: index_uuids
      in: query
      description: comma sep list of index_uuids
      schema:
        type: string
    pageParam:
      name: page
      in: query
      description: page number to load, defaults to 1
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSizeParam:
      name: page_size
      in: query
      description: size of the page to load, defaults to 1000
      schema:
        type: integer
        minimum: 1
        default: 1000
    filterParam:
      name: filter
      in: query
      description: Search keyword for filtering; searches name and title for this substring
      required: false
      schema:
        type: string
        example: MQU
    idsParam:
      name: ids
      in: query
      description: Taken as a comma delimited list of ids to pull. ignored if ?names is specified.
      required: false
      schema:
        type: string
        example: abcd1234,wxyz4567
    nameParam:
      name: name
      in: query
      description: Taken as an *Exact* name to find a resource by
      required: false
      schema:
        type: string
        example: MQUSTB20
    namesParam:
      name: names
      in: query
      description: Taken as a comma delimited list of *Exact* names to find a list if resources by
      required: false
      schema:
        type: string
        example: MQUSTB20,MQUSTRAV
    namespaceParam:
      name: namespace
      in: query
      description: Retrieve all resources in this namespace
      required: false
      schema:
        type: string
        example: my_client_namespace
    fieldsParam:
      name: fields
      in: query
      description: only return these fields, plus id,namespace, for each of the resource definitions
      required: false
      schema:
        type: string
        example: title,description
    debugParam:
      name: debug
      in: query
      description: turns on debugging information by injecting a debug section at the top level
      required: false
      schema:
        type: string
        enum:
          - 'true'
    formatParam:
      name: format
      in: query
      description: choose csv (Default json)
      required: false
      schema:
        type: string
        enum:
          - csv
    uuidParam:
      name: uuid
      in: path
      description: uuid of the resource
      required: true
      schema:
        type: string
