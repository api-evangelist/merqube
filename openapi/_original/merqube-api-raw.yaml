x-internal: true
# the resolved yaml is the public one on Stoplight since it (also, like the swagger editor) has issues rendering http referenced models

openapi: 3.1.0
info:
  version: 4.40.0
  title: MerQube API
  contact:
    name: API Support
    url: https://www.merqube.com/contact
    email: support@merqube.com
  description: MerQube APIs
servers:
  - url: https://api.merqube.com
    description: Production server
  - url: https://api.staging.merqube.com
    description: Testing server for next generation features

paths:
  /index:
    get:
      description: Get all MerQube indices.
      summary: Get all MerQube indices.
      operationId: index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/filterParam'
        - $ref: '#/components/parameters/idsParam'
        - $ref: '#/components/parameters/nameParam'
        - $ref: '#/components/parameters/namesParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/fieldsParam'
        - $ref: '#/components/parameters/debugParam'
        - $ref: '#/components/parameters/formatParam'
        - name: type
          in: query
          description: By default only "prod" indices are shown; comma delimited list of other "types"
          required: false
          schema:
            type: string
            example: test,prod
        - name: fetch_identifiers
          in: query
          description: will return an additional section, linked_resources, that contains all identifier objects that the calling user has permission to that are linked to this index
          required: false
          schema:
            type: string
            enum:
              - 'true'

      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexDefinitionPatchPutGet'
                  error_codes:
                    $ref: '#/components/schemas/ErrorCodes'


    post:
      description: Create a new MerQube index
      summary: Create a new MerQube index
      tags:
        - index
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/IndexDefinitionPost'
                - $ref: '#/components/schemas/CopyFromManifest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Index Creation Response Schema
                properties:
                  id:
                    type: string
                    description: the uuid of this index
                  security_id:
                    type: string
                    description: the uuid of the secapi (type index) security for this index
                  intraday_security_id:
                    type: string
                    description: the uuid of the secapi (type intraday_index) security for this index
                  status:
                    type: string
        '400':
          description: illegal request body
        '403':
          description: not authorized to perform this operation

  /index/{uuid}:
    parameters:
      - $ref: '#/components/parameters/uuidParam'
    get:
      description: Returns the MerQube index with this uuid
      summary: Returns the MerQube index with this uuid
      operationId: index_uuid
      tags:
        - index
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexDefinitionPatchPutGet'
        '403':
          description: not authorized to perform this operation
        '404':
          description: index does not exist
    put:
      description: Replace a MerQube index.
      summary: Replace a MerQube index
      tags:
        - index
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexDefinitionPatchPutGet'
      responses:
        '200':
          description: OK
        '400':
          description: illegal request body
        '403':
          description: not authorized
        '404':
          description: index does not exist

    patch:
      description: Partialy update a MerQube index.
      summary: Partially update a MerQube index
      tags:
        - index
      requestBody:
        content:
          application/json:
            schema:
              type: object
              # TODO; problem here is, this would accept any fields from index def but none are required
        description: any fields from an Index Manifest
      responses:
        '200':
          description: OK
        '400':
          description: illegal request body
        '403':
          description: not authorized
        '404':
          description: index does not exist

    delete:
      description: Delete a MerQube index. Also tries to delete its identifiers.
      summary: Delete a MerQube index.
      tags:
        - index
      responses:
        '200':
          description: OK
        '403':
          description: not authorized
        '404':
          description: index does not exist

  /index/{uuid}/stats:
    get:
      description: Returns stats associated with a specific MerQube index
      summary: Returns stats associated with a specific MerQube index
      operationId: index_stats
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
        - name: metric
          in: query
          description: 'Metric to compute stats on (default: total_return)'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '403':
          description: not authorized to see this namespace
        '404':
          description: index does not exist

  /index/{uuid}/stats2:
    get:
      description: Returns stats associated with a specific MerQube index
      summary: Returns stats associated with a specific MerQube index
      operationId: index_stats
      tags:
        - index
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatsRequest'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '403':
          description: not authorized to see this namespace
        '404':
          description: index does not exist

  /index/{uuid}/caps:
    get:
      description: Get the caps of buffer MerQube index
      summary: Get the caps of buffer MerQube index
      operationId: index_caps
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - in: query
          name: base_symbol
          schema:
            type: string
        - in: query
          name: base_name
          schema:
            type: string
        - in: query
          name: base_plot_metric
          schema:
            type: string
        - $ref: '#/components/parameters/formatParam'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: currently, the date
                          example: '2019-07-20'
                        date:
                          type: string
                          description: date
                          example: '2019-07-20'
                        caps:
                          type: object
                          description: object
                          example:
                            SPY: 0.9036144578
                            cap: 16.8152652821
                            performance: 0.9364820847
        '403':
          description: not authorized to see this namespace
        '404':
          description: index or caps does not exist

  /index/{uuid}/portfolio:
    get:
      description: Get the portfolio of a MerQube index over time
      summary: Get the portfolio of a MerQube index over time
      operationId: index_portfolio
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - name: dates_only
          in: query
          description: include only dates and no portfolio data
          required: false
          schema:
            type: string
            enum:
              - 'true'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
        - in: query
          name: time
          schema:
            type: string
            format: date-time
        - in: query
          name: download
          schema:
            type: string
            description: either true or false
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: currently, the date
                          example: '2005-07-15T00:00:00'
                        date:
                          type: string
                          description: date
                          example: '2005-07-15T00:00:00'
                        portfolio:
                          type: object
                          description: object where each key is a holding
                          example:
                            OPTION:SPY:CALL:0.0:2006-07-21:BUY:
                              buy_sell: BUY
                              exchgcntry: US
                              exercise_type: European
                              expiry: '2006-07-21'
                              mic: XCME
                              option_type: CALL
                              price: 120.31612463831256
                              price_date: '2005-07-15'
                              root: SPY
                              shares: 8.143322475570033
                              strike: '0.0'
                              strike_percentage: 0
                              symbol: OPTION:SPY:CALL:0.0:2006-07-21:BUY
                              weight: 8.143322475570033
                            OPTION:SPY:CALL:143.4491457664114:2006-07-21:SELL:
                              buy_sell: SELL
                              exchgcntry: US
                              exercise_type: European
                              expiry: '2006-07-21'
                              mic: XCME
                              option_type: CALL
                              price: 0.5857132916126346
                              price_date: '2005-07-15'
                              root: SPY
                              shares: -8.143322475570033
                              strike: '143.4491457664114'
                              strike_percentage: 116.81526528209396
                              symbol: OPTION:SPY:CALL:143.4491457664114:2006-07-21:SELL
                              weight: 8.143322 475570033

        '400':
          description: illegal query arg value (e.g., time is not a date-time)
        '403':
          description: not authorized
        '404':
          description: index or portfolio does not exist

  /index/{uuid}/portfolio_allocations:
    get:
      description: Get the allocations of a MerQube index
      summary: Get the allocations of a MerQube index
      operationId: index_portfolio_allocations
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: currently, the date
                          example: '2005-07-15T00:00:00'
                        date:
                          type: string
                          description: date
                          example: '2005-07-15T00:00:00'
                        portfolio:
                          type: object
                          description: object
                          example:
                            OPTION:SPY:CALL:0.0:2006-07-21:BUY: 8.143322475570033,
                            OPTION:SPY:CALL:0.0:2007-07-20:BUY: null,
                            'OPTION: SPY:PUT:116.66:2006-07-21:BUY': 8.143322475570033,
        '403':
          description: not authorized to see this namespace
        '404':
          description: index or portfolio does not exist

  /index/{uuid}/target_portfolio:
    get:
      description: get the timeseries of target portfolios for an index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
        - name: statuses
          in: path
          description: a comma seperated list of portfolio statuses to filter by
          required: false
          schema:
            type: string
            default: FINAL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        eff_ts:
                          $ref: '#/components/schemas/IsoTS'
                        target_portfolio:
                          $ref: '#/components/schemas/BasketPortfolio'
        '403':
          description: not authorized to see this namespace
        '404':
          description: index or portfolio does not exist
    put:
      description: replace the portfolio for this index. Will eventually but not immediately affect /index/uuid/portfolio.
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketPortfolioPutIn'
      responses:
        '200':
          description: OK, portfolio successfully written and validated.
        '400':
          description: bad portfolio or request
        '403':
          description: not authorized
        '404':
          description: index does not exist

  /index/{uuid}/target_portfolio/{target_portfolio_uuid}:
    get:
      description: Get an existing target portfolio
      tags:
        - index
      responses:
        '200':
          description: OK, portfolio successfully retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  eff_ts:
                    $ref: '#/components/schemas/IsoTS'
                  target_portfolio:
                    $ref: '#/components/schemas/BasketPortfolio'
        '400':
          description: Bad request
        '403':
          description: Not authorized
        '404':
          description: Index or target portfolio does not exist

    patch:
      description: Update an existing target portfolio
      tags:
        - index
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketPortfolioPatchIn'
      responses:
        '200':
          description: OK, portfolio successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketPortfolio'
        '400':
          description: Bad request
        '403':
          description: Not authorized
        '404':
          description: Index or target portfolio does not exist
    delete:
      description: Deletes an existing target portfolio
      tags:
        - index
      responses:
        '200':
          description: OK, target_portfolio deleted
        '403':
          description: Not authorized
        '404':
          description: Index or target_portfolio with the provided UUIDs does not exist

  /index/{uuid}/data_collections:
    get:
      description: get the timeseries of data collections for an index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: # Not strictly enforced due to transformation.  Enforcement handled by put.
                $ref: '#/components/schemas/ListDataCollections'
                type: object
                additionalProperties: true
                properties:
                  data_collection:
                    $ref: '#/components/schemas/DataCollectionsSpec'
        '403':
          description: not authorized to see this namespace
        '404':
          description: index or data collection does not exist

    put:
      description: create or replace the data collection specification for this index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data_collections:
                  type: array
                  items:
                    $ref: '#/components/schemas/DataCollectionsSpec'
      responses:
        '200':
          description: OK, data collection successfully written and validated.
        '400':
          description: bad data collection or request
        '403':
          description: not authorized
        '404':
          description: index does not exist

  /index/{uuid}/data_collections/raw:
    get:
      description: Get a presigned raw file redirect for s3
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/dataCollectionsNameParam'
      responses:
        '302':
          description: Moved

  /index/{uuid}/run_state:
    get:
      description: get the latest run state of the index. May be enhanced in the future to support quering for a given eff_ts (e.g., historically).
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunState'
        '403':
          description: not authorized to see this index namespace
        '404':
          description: index or does not exist

  /index/{uuid}/data_collections/data:
    get:
      description: fetch the data collections from s3
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/dataCollectionsNameParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Dynamic, depends on the data collection csv.
        '400':
          description: a required query param is missing
        '403':
          description: not authorized to see this namespace
        '404':
          description: index or data collection does not exist
        '409':
          description: Metadata consistency -- malformed s3 URI, or invalid date col

  /index-documents:
    get:
      tags:
        - index
      description: List of index documents
      parameters:
        - in: query
          name: id
          description: UUID of the index.  Optional for index-specific documents.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Returned list of valid documents in bucket
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    schema:
                      type: object
                      properties:
                        filename:
                          type: string
                        shared:
                          description: If this file is shared by multiple indices or not
                          type: boolean
                        last_modified:
                          description: UTC ISO timestamp when file was last modified
                          $ref: '#/components/schemas/IsoTS'

    put:
      tags:
        - index
      description: Upload a document for an index
      parameters:
        - in: query
          name: id
          description: UUID of the index.  Optional for index-specific documents.
          required: false
          schema:
            type: string
        - in: query
          name: force_overwrite
          description: Overwrite a document
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK status of upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: Invalid multipart request, or file exists and requires overwrite flag.

    index/{uuid}/identifier/{identifier_uuid}:
    delete:
      description: Delete an identifier from an index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/identifierParam'
      responses:
        '200':
          description: OK
        '403':
          description: not authorized
        '404':
          description: index or identifier does not exist


  index/{uuid}/identifier/{provider}/{identifier_name}:
    delete:
      description: Delete an identifier from an index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/providerParam'
        - $ref: '#/components/parameters/identifierNameParam'
      responses:
        '200':
          description: OK
        '403':
          description: not authorized
        '404':
          description: index or identifier does not exist

  index/{uuid}/identifier/{provider}:
    post:
      description: Add an identifier to an index
      tags:
        - index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - $ref: '#/components/parameters/providerParam'
      requestBody:
        content:
          application/json:
            schema:
              - $ref: '#/components/schemas/IndexIdentifierUUIDPost'
      responses:
        '200':
          description: OK
        '400':
          description: bad request
        '403':
          description: not authorized
        '404':
          description: index does not exist

  /index/{uuid}/documents:
    get:
      tags:
        - index
      description: Get documentation for an index
      parameters:
        - $ref: '#/components/parameters/uuidParam'
        - in: query
          name: document_type
          description: Document key in the index manifest which contains the file name.  Defaults to "methodology".
          required: false
          schema:
            type: string
            default: methodology
      responses:
        '200':
          description: File found and returning presigned url to file
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '400':
          description: No documents found in the index manifest, or invalid document type
        '403':
          description: not authorized to see this namespace
        '404':
          description: Document not found

  # LEGACY equity secs

  /security/equity_legacy/{secname}/metrics:
    get:
      description: Get the metrics defined for a security
      summary: Get the metrics defined for a security
      operationId: security_metrics_defs
      tags:
        - legacy_equity_security
      parameters:
        - $ref: '#/components/parameters/secnameParam'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricsDef'
        '403':
          description: not authorized
        '404':
          description: security does not exist

  /security/equity_legacy/{secname}/metrics/{name}:
    get:
      description: Get a metrics definition for a security
      summary: Get a metrics definition for a security
      operationId: security_metrics_def
      tags:
        - legacy_equity_security
      parameters:
        - $ref: '#/components/parameters/secnameParam'
        - in: path
          required: true
          name: name
          schema:
            type: string
          description: name of metric
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsDef'
        '403':
          description: not authorized
        '404':
          description: security does not exist

  /security/equity_legacy/{secname}/metrics/{name}/data:
    get:
      description: Get the metrics timeseries of a MerQube security
      summary: Get the metrics timeseries of a MerQube security
      operationId: security_metrics
      tags:
        - legacy_equity_security
      parameters:
        - name: secname
          in: path
          description: name of the security for which the data is requested
          required: true
          schema:
            type: string
        - in: path
          required: true
          name: name
          schema:
            type: string
          description: name of metric
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Metrics'
        '400':
          description: bad metric requested
        '404':
          description: security does not exist

  /security/equity_legacy/{secname}/stats:
    get:
      description: Returns stats associated with a specific MerQube security
      summary: Returns stats associated with a specific MerQube security
      operationId: secstats
      tags:
        - legacy_equity_security
      parameters:
        - $ref: '#/components/parameters/secnameParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
        - name: metric
          in: query
          description: 'Metric to compute stats on (default: total_return)'
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/formatParam'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '403':
          description: not authorized to see this namespace
        '404':
          description: index does not exist

  # Secapi
  /security:
    get:
      description: Returns the list of security types (note - equity is not currently under this)
      summary: Returns the list of security types
      tags:
        - security
      responses:
        '200':
          description: list of security types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string

  /security/{type}:
    parameters:
      - $ref: '#/components/parameters/sectypeParam'
    post:
      description: Insert new securities
      summary: Insert new securities
      tags:
        - security
      requestBody:
        description: some of this is a WIP RE initial metrics etc. Making a contract may have fields rem
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSecurity'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCreationResponse'
        '400':
          description: bad request
        '403':
          description: unauthorized
        '409':
          description: duplicate, e.g., name already exists

    get:
      description: get one or more metrics for one or more securities
      summary: get one or more metrics for one or more securities
      tags:
        - security
      parameters:
        - $ref: '#/components/parameters/nameParam'
        - $ref: '#/components/parameters/namesParam'
        - in: query
          name: id
          schema:
            type: string
          description: single id to pull
        - $ref: '#/components/parameters/idsParam'
        - in: query
          name: metrics
          schema:
            type: string
          description: comma delimited list of metrics
          example: Level,Portfolio
        - in: query
          name: securityfilter
          schema:
            type: string
          description: |
            a tiny query language that allows filtering securities by their metric values.
            For example, 'get all futures contracts with expiry < x and root == Y'.

            This is not a row-level filter.
            This is intended for 'metadata' like metrics and not for metrics with many values, as the results could be surprising.
            For example, 'get me prices for this week for all stocks that have ever closed above 1000' will contain this weeks results, and those prices may be < 1000;
              however, given this filter, those stocks *at one point* closed > 1000.

            Parenthesis and logicl ors between clauses are not currently supported.
            An arbitrary number of and clauses is supported, and or within a clause is supported, IE 'root = X or Y'

            The supported value oeprators are '!=', '==', '>=', '<=', '<', '>'

            The first parsed operator in each `^` seperated clause is used as the operator - no additional checking is performed, so something like
            `==<=` will be parsed as "is equal to `<=`" which is probably not what you want (and is likely to return an empty result set).

            The supported logical operators are '^' (and, since & conflicts with URL query args) and ',' (or)

            When the target value is a list (contains ','), the only two valid operators are != and ==. IE you cannot use <=X,Y etc.

            When the operator is '==' and the value is '*', it means "the security has this metric defined at least once" (ie, we don't care about the value, just that the row exists)

            Examples -

              futures_contract...&securityfilter=root==BTC,B6 - all contracts with root euql to BTC or B6

              futures_contract...&securityfilter=root==BTC^expiry.merq>=2022-01-01T00:00:00 - all contracts with BTC root expiring in 2022 or later

              futures_root...&securityfilter=cme_limit_scaling_factor!=1.0 - all roots with a special/custom scaling factor such as cents

            It can also replace the names= parameter, e.g.,

               futures_root...&securityfilter=name==A6,B6 - get the roots named either A6 or B6 (returns 2 records)

        - in: query
          name: namespace
          schema:
            type: string
          description: only return securities in this namespace
          example: mybank
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
        - $ref: '#/components/parameters/formatParam'
        - name: as_of
          in: query
          description: view the database as_of a certain timestamp; data corrections that were backdated but inserted after this timestamp are ignored
          schema:
            description: should be a date-time as a string; YYYY-mm-dd HH-mm-ss
            type: string
        - name: since
          in: query
          description: view only data that was received since this timestamp. Note that because data could be corrected for previous days (eff_ts), this does not necessarily mean that eff_ts >= the since date. This will obtain data that was known about on or after the since date, but that data could be a correction for previous days.
          schema:
            description: should be a date-time as a string; YYYY-mm-dd HH-mm-ss
            type: string
        - name: raw
          in: query
          description: only applies when format!=csv. Includes additional information about the raw security api records, such as the provider timestamp and the source of the data. This is an employee only feature.
          schema:
            type: boolean
        - name: show_full_history
          in: query
          description: Shows the full history of records including corrected records (that is, no `max(prov_ts)`)). This is an employee only feature. Also implies raw=true automatically. NOTE, this breaks the typical unique index of `id/eff_ts/metric` because if there were corrections, the metric may have changed multiple times - the new unique index includes `prov_ts` in this case.
          schema:
            type: boolean
        - name: debug
          in: query
          description: turns on debugging information by injecting a debug section at the top level
          required: false
          schema:
            type: string
            enum:
              - 'true'
        - name: validated_only
          in: query
          description: Only return records that have been validated by internal data quality system. Defaults to false
          schema:
            type: boolean
        - $ref: '#/components/parameters/preferReadReplicaParam'

      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityMetrics'
                  error_codes:
                    $ref: '#/components/schemas/ErrorCodes'

            text/csv:
              example: ts,index,Level,Portfolio 2021-07-21T00:00:00,XXX,1,[...]

        '403':
          description: not authorized

