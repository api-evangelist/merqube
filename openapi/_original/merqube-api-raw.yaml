components:
  schemas:
    MetricResult:
      type: object
      properties:
        value:
          type: number
          nullable: true
          description: The computed value of the metric, or null if it failed.
        error:
          type: string
          nullable: true
          description: Error message if the metric could not be computed.

    StatsResponse:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricResult'
          description: A dictionary of computed metrics and their results or errors.

    StatsRequest:
      type: object
      required:
        - return_period
      properties:
        start_date:
          type: string
          format: date
          example: '2006-12-29'
        end_date:
          type: string
          format: date
          example: '2006-12-29'
        index_metric:
          type: string
          example: price_return
          default: price_return
        target_return:
          type: number
          format: float
          minimum: 0
          example: 0
        return_period:
          type: string
          enum:
            - D
            - W
            - M
            - Y
          example: D
        benchmark:
          type: object
          required:
            - identifier
            - identifier_type
            - type
          properties:
            benchmark_type:
              type: string
              enum:
                - MERQUBE_INDEX
                - EQUITY
              example: MERQUBE_INDEX
            identifier_type:
              type: string
              enum:
                - TICKER
                - FSYM_ID
              example: TICKER
            identifier:
              type: string
              example: MY_INDEX_NAME
            metric:
              type: string
              example: index_level

    IntradayPublishConfigWrapper:
      description: oneOfs at the top level of an object lead to hard to work with RootModels in pydantic. Forming this one property object makes importing and passing around this object less painful; there is a lot of code that passes this around.
      type: object
      properties:
        publish_config:
          $ref: '#/components/schemas/IntradayPublishConfig'

    AlertHours:
      type: object
      properties:
        start:
          description: Start of the silent hours in HH:MM 24h format. The timezone is based on the intraday.tzinfo
          type: string
          pattern: ^[0-2]{1}[0-9]{1}:[0-5]{1}[0-9]{1}$
        end:
          description: Start of the silent hours in HH:MM 24h format. The timezone is based on the intraday.tzinfo
          type: string
          pattern: ^[0-2]{1}[0-9]{1}:[0-5]{1}[0-9]{1}$

    IntradayAlertType:
      type: string
      enum:
        - opsgenie
        - slack

    IntradayFlatlineAlerts:
      type: object
      properties:
        enabled:
          description: If the flatline alert should be enabled
          type: boolean
          default: true
        window_length:
          description: window_length in minutes for flatline alert
          default: 5
          type: integer
          minimum: 1
        min_ticks:
          description: Minimum number of ticks in the window to be the same to considered a flatline
          type: integer
          minimum: 2
        alert_hours:
          $ref: '#/components/schemas/AlertHours'
        alert_type:
          $ref: '#/components/schemas/IntradayAlertType'
          default: opsgenie
          description: Type of alert to send when flatline is detected. Default is opsgenie.

    IntradayAlerting:
      description: Alerting configuration for intraday ticks
      type: object
      additionalProperties: false
      properties:
        flatline_alerts:
          $ref: '#/components/schemas/IntradayFlatlineAlerts'

    Intraday:
      allOf:
        - $ref: '#/components/schemas/IntradayPublishConfigWrapper'
        - type: object
          description: Only available for indexes with intraday tick computation
          additionalProperties: false
          required:
            - enabled
            - tzinfo
          properties:
            enabled:
              description: If the intraday process should be run or not
              type: boolean
            security_id:
              description: Security ID of the intraday_index security where ticker data is served
              type: string
            ticker_period:
              description: Duration between ticker datapoints. In seconds
              type: number
              minimum: 1
            tzinfo:
              description: Timezone of intraday tick timestamp comparisons
              type: string
            active_time_ranges:
              type: array
              items:
                $ref: '#/components/schemas/IntradayTickFilter'
            infra_timed_scaling:
              $ref: '#/components/schemas/IntradayInfraTimedScaling'
            calculation_max_retry_delay:
              description: How many seconds to keep retrying the real time calculation before setting the force flag. Defalts to 0 which means retry forever.
              type: integer
              minimum: 0
            resource_cpu_request:
              description: Minimum cpu resources requested in milliCPU
              type: integer
              minimum: 1
            resource_memory_request:
              description: Minimum memory resources requested in mebibytes.
              type: integer
              minimum: 0
            heartbeat_timeout:
              description: Max number of seconds between heartbeats before the rtindex pod is considered unhealthy
              type: integer
              minimum: 1
            startup_failure_timeout:
              description: Max number of seconds to wait for the first heartbeat from the rtindex pod before considering it a failed startup. By default it will wait 40sec
              type: integer
              minimum: 1
            data_refresh_period:
              description: After the rtindex refreshes its data this is the number of seconds to wait before refreshing again. 0 means do not refresh. Defaults to 3600 seconds (60min)
              type: integer
              minimum: 0
            tick_delay:
              description: Number of seconds to delay intraday calculation
              type: integer
              minimum: 0
            alerting:
              $ref: '#/components/schemas/IntradayAlerting'
            ohl_enabled:
              description: Should send Open High Low data to providers
              type: boolean
              default: false
            opening_tick_time:
              description: The time of opening tick in index's timezone. The index will send data against this
              type: string
              pattern: ^(?:[01]\d|2[0-3]):(?:[0-5]\d):(?:[0-5]\d)$ # need to use single quote her else things break

    # Index definitions
    Administrative:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - data point
            - verification
            - calculation
            - development
            - administration
        deadlines:
          type: array
          items:
            $ref: '#/components/schemas/Deadline'
        client:
          type: object
          properties:
            requested_by:
              description: this is the actual OAuth token email that originated the POST on index-template (similar to created_by and last_modified_by). Except, this is the user on the templating POST not the actual POST to index because the post to index is going to be a MerQube employee, but we need to capture who originated the templating request aka who called the meta-api. This field is used to put this index on that user's Manage My Indices page.
              type: string
            approved_by:
              description: if a client requests an index to a finanancial institution, and that instituion approves the index parameters for launch, this holds the oauth email of that approver
              type: string
            owner:
              description: the idea here is to capture the client at a higher level than the above, e.g., this index is owned by Bank of Greatness.
              # should probably be made into a real CRUD
              type: string

    IndexDefinitionPost:
      type: object
      title: Index Manifest
      required:
        - description
        - administrative
        - launch_date
        - name
        - stage
        - title
      additionalProperties: false
      properties:
        administrative:
          $ref: '#/components/schemas/Administrative'
        base_date:
          $ref: '#/components/schemas/BaseDate'
        base_year:
          type: integer
        benchmark:
          oneOf:
            - $ref: '#/components/schemas/IndexBenchmark'
            - type: array
              items:
                $ref: '#/components/schemas/IndexBenchmark'
        calc_freq:
          type: string
          enum:
            - Daily
            - Daily, EOD
            - Intraday
        currency:
          type: string
        custom_metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricsSchema'
        description:
          type: string
        display_month:
          type: string
          enum:
            - Jan
            - Feb
            - Mar
            - Apr
            - May
            - Jun
            - Jul
            - Aug
            - Sep
            - Oct
            - Nov
            - Dec
        documents:
          type: object
        excess_strategy:
          type: string
          enum:
            - keep_in_cash
        family:
          type: string
        family_description:
          type: string
        family_codes:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
        first_value_date:
          description: the first date that the index has a value; if set, will be < base_date
          $ref: '#/components/schemas/IsoDate'
        identifiers:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/IdentifierUUIDRef'
        intraday:
          $ref: '#/components/schemas/Intraday'
        launch_date:
          type: string
        methodology:
          type: string
        month:
          type: integer
        name:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9-_]{0,99}$
        namespace:
          type: string
        plot_metric:
          type: string
        portfolio_allocation_display:
          type: boolean
          description: whether or not portfolio_allocations are shown on the website. false by default
        portfolio_display:
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  display_name:
                    type: string
                  field_name:
                    type: string
        portfolio_handler_id:
          type: string
        rebal_freq:
          $ref: '#/components/schemas/RebalFrequency'
        related:
          type: array
          items:
            $ref: '#/components/schemas/Related'
        run_configuration:
          $ref: '#/components/schemas/RunConfig'
        run_configurations:
          type: array
          items:
            $ref: '#/components/schemas/RunConfigLabel'
        sales_force_deal_id:
          type: string
          description: SalesForce Deal ID
        spec:
          $ref: '#/components/schemas/IndexSpec'
        freezer_config:
          $ref: '#/components/schemas/FreezerConfig'
        calculation_check:
          $ref: '#/components/schemas/CalculationCheck'
        stage:
          type: string
          enum:
            - prod
            - test
            - development
            - backtest
            - inqubator
        tags:
          type: string
        title:
          type: string
        webpage:
          $ref: '#/components/schemas/Webpage'
        weighting_method:
          type: string
          enum:
            - Other
            - Equal
        eod_rt_price_check:
          type: boolean
        notify_configuration:
          $ref: '#/components/schemas/NotificationConfig'
        fill_missing_data:
          type: boolean
          description: Controls missing equity price recovery. The API derives this flag from stage and stores true only for backtest; all other stages store false.

    # see https://swagger.io/docs/specification/data-models/inheritance-and-polymorphism/
    # On POST, status is illegal. Subsequently, its always there and required on patch/put. Same with ID.
    IndexDefinitionPatchPutGet:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/IndexDefinitionPost'
        - $ref: '#/components/schemas/CrudExtra'

    RebalFrequency:
      type: string
      enum:
        - Annual
        - Daily
        - Monthly
        - Quarterly
        - Semi-Annual
        - Weekly
        - Bi-Monthly
        - Intraday
        - None

    IndexSpec:
      type: object
      required:
        - index_class_code
      properties:
        index_class_code:
          type: string
        index_class_args:
          type: object
        index_variables:
          type: object
          description: TODO
        version:
          type: integer


    CalculationCheck:
      type: array
      items:
        type: object
        oneOf:
          - $ref: '#/components/schemas/LevelCheck'
          - $ref: '#/components/schemas/PercentChangeCheck'
          - $ref: '#/components/schemas/HistoryCheck'


    BaseCheck:
      type: object
      required:
        - metric
        - enabled
      properties:
        metric:
          type: string
        enabled:
          type: boolean
        alert_type:
          type: string
          default: fail_computation
          enum:
            - email
            - slack
            - opsgenie
            - fail_computation


    LevelCheckParams:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true


    LevelCheck:
      type: object
      required:
        - check_type
        - params
      allOf:
        - type: object
          properties:
            check_type:
              type: string
              enum:
                - LEVEL_CHECK
        - $ref: '#/components/schemas/BaseCheck'
        - type: object
          properties:
            params:
              $ref: '#/components/schemas/LevelCheckParams'


    PercentChangeCheckParams:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true


    PercentChangeCheck:
      type: object
      required:
        - check_type
        - params
      allOf:
        - type: object
          properties:
            check_type:
              type: string
              enum:
                - PERCENT_CHANGE_CHECK
        - $ref: '#/components/schemas/BaseCheck'
        - type: object
          properties:
            params:
              $ref: '#/components/schemas/PercentChangeCheckParams'


    HistoryCheckParams:
      type: object
      required:
        - days
      properties:
        days:
          type: integer
          minimum: 0
          maximum: 365
          nullable: true


    HistoryCheck:
      type: object
      required:
        - check_type
        - params
      allOf:
        - type: object
          properties:
            check_type:
              type: string
              enum:
                - HISTORY_CHECK
        - $ref: '#/components/schemas/BaseCheck'
        - type: object
          properties:
            params:
              $ref: '#/components/schemas/HistoryCheckParams'


    Related:
      type: object
      required:
        - id
        - name
        - type
      properties:
        default_display:
          type: boolean
          default: false
        id:
          type: string
        metric:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - security
            - index

    Webpage:
      type: object
      properties:
        custom_charts:
          type: array
          items:
            $ref: '#/components/schemas/CustomCharts'
        visible:
          type: boolean
          default: true

    CustomCharts:
      type: object
      additionalProperties: false
      required:
        - name
        - xlabel
        - ylabel
      properties:
        name:
          type: string
        xlabel:
          type: string
        ylabel:
          type: string
        chart_type:
          type: string
          enum:
            - line
            - spline
            - area
            - bar
            - column
          default: line
        compare_mode:
          type: string
          enum:
            - absolute
            - percent
          default: percent
        constructor_type:
          type: string
          enum:
            - chart
            - stockChart
          default: stockChart
        size:
          type: number
          default: 12
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - url
              - array_field
              - values
              - key_field
            properties:
              url:
                type: string
              array_field:
                type: string
              values:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - display_name
                    - path
                  properties:
                    display_name:
                      type: string
                    path:
                      type: string
              key_field:
                type: string

    IndexBenchmark:
      type: object
      additionalProperties: false
      required:
        - ticker
        - threshold
      properties:
        ticker:
          type: string
          description: accepts either FSYM_ID, or MQI:XXX to benchmark against another index.
          example: MQI:XXX
        threshold:
          description: the deviation that triggers an outlier event, IE, the daily difference of the index vs the daily difference of the underlying should not be more than this percent
          type: number
          example: 0.05
        index_metric:
          description: the metric of this index to compare against the ticker/threshold, eg can compare some other metric of this index than price_return
          type: string
          default: price_return
          example: total_return
        benchmark_metric:
          type: string
          description: only accepted if the ticker is an MQI. The metric of the benchmark index to compare against; eg can compare to some other metric than price_return of the benchmark
          default: price_return
          example: total_return

    # Idenfitiers/providers

    IdentifierUUIDPost:
      description: Identifier for a given provider. Will be referenced via the name field of the Identifier section
      type: object
      required:
        - name
        - ticker
        - index_name
      # provider is not required here because its in the URL
      additionalProperties: false
      properties:
        display_name:
          type: string
        # needed to make sure tickers arent reused across indices; so we cant point multiple indices at this ticker
        # note however that an index can point to multiple tickers.
        index_name:
          type: string
        metric:
          type: string
        name:
          description: unique name among all other Identifiers of the provider resource type.
          type: string
          # reserved URL chars: https://developers.google.com/maps/url-encoding
          pattern: ^[^!*'() ;:@&=+$,/?%#\[\]]
        namespace:
          type: string
        rounding_decimals:
          type: integer
          description: If rounding_type=standard, corresponds to number of decimal places to round to. If rounding_type=sigfig, corresponds to number of significant figures to round to.
        rounding_type:
          type: string
          enum: [standard, sigfig]
          default: standard
          description: Type of rounding to apply to the disseminated data. standard = normal python round(), sigfig = significant figures rounding.
        provider_kwargs:
          anyOf:
            - $ref: '#/components/schemas/BloombergProviderKwargs'
            - $ref: '#/components/schemas/ReutersProviderKwargs'
            - $ref: '#/components/schemas/SecapiProviderKwargs'
            - $ref: '#/components/schemas/NasdaqProviderKwargs'
        start_date:
          type: string
          format: date
        ticker:
          type: string
        num_days:
          type: integer
          description: Number of days to disseminate data for
          minimum: 0

    IdentifierUUIDPatchPutGet:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/IdentifierUUIDPost'
        - $ref: '#/components/schemas/CrudExtra'


    IndexIdentifierUUIDPost:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/IdentifierUUIDPost'
        - type: object
          properties:
            enabled:
              type: boolean
              default: true
              description: Determines if the index will disseminate data based to this provider, default is true

    IdentifierUUIDRef:
      description: maps to an identifier resource
      type: object
      additionalProperties: false
      required:
        - name
        - provider
      properties:
        name:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        enabled:
          default: true
          description: Determines if the index will disseminate data based on this Identifier
          type: boolean

    Provider:
      description: currently supported providers
      type: string
      enum:
        - bloomberg
        - reuters
        - morningstar
        - factset
        - nasdaq
        - wind
        - secapi
      example: bloomberg

    BloombergProviderKwargsPostType:
      type: string
      description: How to post the data to Bloomberg, either the end of day method (EOD), real time method (RT) or both (EOD_AND_RT)
      enum:
        - EOD
        - RT
        - EOD_AND_RT

    BloombergProviderKwargs:
      type: object
      description: Bloomberg provider custom arguments
      additionalProperties: false
      properties:
        post_type:
          $ref: '#/components/schemas/BloombergProviderKwargsPostType'
      required:
        - post_type

    ReutersProviderKwargsPostType:
      type: string
      description: How to post the data to Reuters, either the end of day method (EOD), real time method (RT) or both (EOD_AND_RT)
      enum:
        - EOD
        - RT
        - EOD_AND_RT
        - EOD_AND_RT_COMBINED

    ReutersProviderKwargs:
      type: object
      description: Reuters provider custom arguments
      additionalProperties: false
      properties:
        post_type:
          $ref: '#/components/schemas/ReutersProviderKwargsPostType'

    SecapiProviderKwargs:
      type: object
      description: Secapi provider custom arguments
      additionalProperties: false
      properties:
        security_type:
          type: string
        security_name:
          type: string
        metric:
          type: string
      required:
        - security_type
        - security_name
        - metric

    NasdaqProviderKwargs:
      type: object
      description: Nasdaq provider custom arguments
      additionalProperties: false
      properties:
        nasdaq_env:
          type: string
          description: Which Nasdaq environment to send data to
          enum:
            - testing
            - production
        eod_date_delta:
          type: integer
          description: How many days to offset the Nasdaq date (T if before 6:30pm EST otherwise T + 1) when getting EOD data from the Index
      required:
        - nasdaq_env

    ListDataCollections:
      type: object
      additionalProperties: true
      properties:
        data_collection:
          type: array
          items:
            $ref: '#/components/schemas/DataCollectionsSpec'
          default_factory: list

    DataCollectionsSpec:
      type: object
      description: schema for data collections
      additionalProperties: true
      required:
        - name
        - location
        - index_dc_subtype
      properties:
        index_dc_subtype:
          description: Index Data Collection Subtype object key moves to array after transformation
          type: string
        auto_persist:
          default: false
          description: Boolean to indicate whether to automatically persist the data. Default is false.
          type: boolean
        compression:
          default: GZIP
          enum:
            - NONE
            - GZIP
          type: string
        date_col:
          default: date
          type: string
        format:
          default: csv
          enum:
            - csv
          type: string
        layout_type:
          default: SINGLE_FILE
          description: 'SINGLE_FILE: one file. YEARLY_DIR_DAILY_FILE: one directory per year, each day, a file with YYYYMMDD format.'
          enum:
            - SINGLE_FILE
            - YEARLY_DIR_DAILY_FILE
          type: string
        location:
          type: string
        name:
          maxLength: 128
          minLength: 3
          pattern: ^[A-Za-z0-9_]*$
          type: string
        seed_file_path:
          description: Seed file for the data collection.
          type: string
        start_time:
          type: string

    BasketPortfolioPutIn:
      type: object
      description: >
        Input data for creating/replacing target portfolios.
        This object captures all information needed to execute externally defined rebalances.
      additionalProperties: false
      required:
        - timestamp
        - positions
        - unit_of_measure
      properties:
        positions:
          title: Positions
          type: array
          items:
            $ref: '#/components/schemas/ValidEquityBasketPosition'
        timestamp:
          description: the time at which the portfolio should take effect
          $ref: '#/components/schemas/IsoTS'
        unit_of_measure:
          $ref: '#/components/schemas/PortfolioUom'
        target_portfolio_type:
          type: string
          enum:
            - EOD
            - INTRADAY
          default: EOD
          description: Whether its an end of day portfolio or an intraday portfolio.
        share_selection_date:
          description: Share selection date, if specified, should be before the effective date (parameter 'timestamp') for this Target Portfolio. In case when the unit_of_measure is set to WEIGHT, we first determine the shares using the prices on the share selection date. If any constituent is de-listed by the share selection date, then that constituent's weight is distributed to other constituents before selecting the shares. We then apply the corporate actions from the share selection date to the day before the portfolio effective date. In case when the unit_of_measure is set to SHARES, we follow the similar steps as above, except the step of determining shares, as it is not needed.
          $ref: '#/components/schemas/IsoTS'
        divisor:
          type: number
          description: A scaling factor to apply for the SHARES of the portfolio constituents
        external_id:
          type: string
          description: An external ID to reference this portfolio with. Must be unique per index.

    BasketPortfolioPatchIn:
      type: object
      description: >
        Input data for updating an existing target portfolio
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PortfolioStatus'
        status_change_reason:
          type: string

    BasketPortfolioRaw:
      type: object
      description: >
        Target Portfolio. Supports equities, futures, and options.
        This object captures all information needed to execute externally defined rebalances.
        This is the raw data from the data store layer.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/BasketPortfolioPutIn'
        - type: object
          required:
            - id
            - status
          properties:
            id:
              type: string
              example: 0000699a-fcd7-45d4-8ce4-064a4ffeced0
            status:
              $ref: '#/components/schemas/PortfolioStatus'
              default: FINAL
            status_change_reason:
              type: string
            created_ts:
              $ref: '#/components/schemas/IsoTS'
            finalized_ts:
              $ref: '#/components/schemas/IsoTS'

    BasketPortfolio:
      type: object
      description: >
        Target Portfolio. Supports equities, futures, and options.
        This object captures all information needed to execute externally defined rebalances.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/BasketPortfolioRaw'
        - type: object
          required:
            - created_ts
          properties:
            created_ts:
              $ref: '#/components/schemas/IsoTS'

    TimestampWindow:
      type: object
      additionalProperties: false
      required:
        - end_ts
      properties:
        start_ts:
          type: string
          description: the time of day of the deadline
          pattern: ^(?:[01]\d|2[0-3]):(?:[0-5]\d):(?:[0-5]\d)$
        end_ts:
          type: string
          description: the time of day of the deadline
          pattern: ^(?:[01]\d|2[0-3]):(?:[0-5]\d):(?:[0-5]\d)$
        tzinfo:
          type: string
          description: Timezone of the window

    TargetPortfolioHandlerPatchPutGet:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/TargetPortfolioHandlerPost'
        - $ref: '#/components/schemas/CrudExtra'


    TargetPortfolioHandlerPost:
      type: object
      description: Describes how to handle the validation and selection of Target Portfolios
      additionalProperties: false
      required:
        - name
        - namespace
      properties:
        name:
          type: string
        namespace:
          type: string
          description: the calling user must have permission to this namespace to create the handler in this namespace
        validation_window:
          $ref: '#/components/schemas/TimestampWindow'
        selection_window:
          $ref: '#/components/schemas/TimestampWindow'
        auto_select:
          type: boolean
          description: If true, the handler will automatically select the last valid portfolio for an effective timestamp
        eod_final_portfolio_lock_enabled:
          type: boolean
          default: false
          description: If true, finalized EOD target portfolios are locked after final selection.
        validator_fn:
          type: string
        intraday_validation_window:
          $ref: '#/components/schemas/TimestampWindow'
          description: Window to submit intraday portfolios for validation.
        intraday_selection_window:
          $ref: '#/components/schemas/TimestampWindow'
          description: Window to select intraday portfolios for an effective timestamp.
        intraday_auto_select:
          type: boolean
          description: If true, the handler will automatically select the last valid intraday portfolio for an effective timestamp
        intraday_final_portfolio_lock_enabled:
          type: boolean
          default: false
          description: If true, finalized intraday target portfolios are locked after final selection.
        intraday_validator_fn:
          type: string
        event_notification_config:
          type: object
          additionalProperties: false
          properties:
            PENDING_VALIDATION:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'
            FAILED_VALIDATION:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'
            PASSED_VALIDATION:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'
            SELECTED:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'
            UNSELECTED:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'
            FINAL:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'
            PAST_DEADLINE:
              $ref: '#/components/schemas/TargetPortfolioHandlerNotificationConfig'

    TargetPortfolioHandlerNotificationConfig:
      type: object
      additionalProperties: false
      properties:
        diss_destinations:
          $ref: '#/components/schemas/DisseminationDestinations'
        file_name_format:
          type: string

    RealTimeTradeType:
      title: RealTimeTradeType
      description: Trade types that can be used for real time quotes. Examples of ineligible trade types are dark pool and odd lot trades.
      enum:
        - ELIGIBLE
        - INELIGIBLE

    PortfolioUom:
      type: string
      title: PortfolioUom
      description: Used to indicate if portfolio amounts are absolute or relative. weight indicates portfolio amounts are relative weights units indicates portfolio amounts are absolute values, e.g. shares or number of contracts
      enum:
        - SHARES
        - WEIGHT

    PortfolioStatus:
      type: string
      title: PortfolioStatus
      description: >
        Indicates the status of a target portfolio.  A portfolio can only be used in an index if status is `FINAL`
        * `PENDING_VALIDATION` - Custom validation is necessary, and is queued up
        * `FAILED_VALIDATION` - Custom validation has failed.
        * `PASSED_VALIDATION` - Custom validation has succeeded. The portfolio must now be selected
        * `SELECTED` - Selected for usage on a date, but has not yet been locked in / finalized
        * `UNSELECTED` - Was previously selected, but a newer portfolio has replaced it for that date
        * `FINAL` - This portfolio can now be used for the given date.
        * `DELETED` - This portfolio has been deleted or rejected for usage.
      enum:
        - PENDING_VALIDATION
        - FAILED_VALIDATION
        - PASSED_VALIDATION
        - SELECTED
        - UNSELECTED
        - FINAL
        - DELETED


    BasketPosition:
