          description: won't let user create a basket with base date before at least 70% of basket's IPO dates
          default: true

        constituents:
          type: array
          items:
            type: object
            required:
              - identifier
              - identifier_type
            properties:
              identifier:
                title: Identifier
                type: string
              identifier_type:
                $ref: '#/components/schemas/PositionIdentifierType'
              amount:
                type: number
                minimum: 0
                maximum: 100
        rebalance_calendar:
          $ref: '#/components/schemas/HolidayCalendarSpec'
        holiday_calendar_config:
          type: object
          oneOf:
            - $ref: '#/components/schemas/LegacyStaticBasketCalendarConfig'
            - $ref: '#/components/schemas/StaticBasketCalendarConfig'

    RebalanceConfig:
      type: object
      required:
        - rebalance_dates
        - rebalance_method
        - selection_dates
      properties:
        rebalance_method:
          $ref: '#/components/schemas/RebalanceMethodConfig'
        rebalance_dates:
          $ref: '#/components/schemas/PeriodicDateConfig'
        selection_dates:
          type: string
          enum:
            - rebalance_date
            - prev_month
            - prev_week


    ClientSSTRSpecific:
      type: object
      additionalProperties: false
      required:
        - ric
      properties:
        ric:
          description: set to the RIC of the underlying equity
          example: LMVH.PA
          type: string
        reinvestment_type:
          $ref: '#/components/schemas/ReinvestmentTime'
          default: AT_OPEN

    ClientDecrementSpecific:
      type: object
      additionalProperties: false
      required:
        - fee_value
        - fee_type
        - day_count_convention
        - underlying
      properties:
        fee_value:
          description: set to the value of the fee to apply. For fixed, this is bps, for percentage_pre/post this is given as a percentage
          example: 0.05
          type: number
        fee_type:
          type: string
          description: set to the type of fee to apply
          enum:
            - fixed
            - percentage_pre
            - percentage_post
            - fixed_points_underlying
          example: fixed
        day_count_convention:
          type: string
          description: must either adapt to a fixed number of days in a year e.g. 'f360' or to Actual ISDA convention, i.e. 'actual'
          example: f360
        underlying:
          $ref: '#/components/schemas/ClientDecrementUnderlying'
          example:
            identifier_type: RIC
            identifier: COST.OQ
        start_date:
          type: string
          format: date
          description: set to the start date of the index if it is to differ from base_date. If this is specified, it must be before base_date. In this case the base_date, base_value is used as a fixed intercept, with the index level starting from start_date and passing through that intercept
          example: 2004-01-04

    ClientDecrementUnderlyingIDType:
      type: string
      description: currently supported identifier types for decrement underlyings
      enum:
        - RIC
        - MERQUBE_INDEX
      example: RIC

    ClientDecrementUnderlying:
      type: object
      additionalProperties: false
      required:
        - identifier_type
        - identifier
      properties:
        identifier_type:
          $ref: '#/components/schemas/ClientDecrementUnderlyingIDType'
        identifier:
          type: string
          example: COST.OQ

    LevelOverride:
      type: object
      additionalProperties: false
      required:
        - date
        - level
      properties:
        date:
          $ref: '#/components/schemas/IsoDate'
        level:
          type: number
        comment:
          type: string
      example:
        date: '2022-03-18'
        level: 1364.344
        comment: test for some special day for some special reason

    ClientEBCoraxConfig:
      type: object
      description: how to handle corporate actions
      additionalProperties: false
      properties:
        reinvest_dividends:
          type: boolean
          default: true
          example: false
        reinvest_dividend_type:
          type: string
          enum:
            - INDEX
            - SECURITY
            - CASH
        deduct_tax:
          type: boolean
          default: false
        reinvest_day:
          type: string
          enum:
            - AT_OPEN
            - AT_CLOSE
          default: AT_OPEN

    FeeDeductionSource:
      type: string
      enum:
        - ALL_CONSTITUENTS
        - CASH

    DayCountConvention:
      type: string
      enum:
        - f250
        - f252
        - f360
        - f365
        - actual

    HighWaterMarkMode:
      type: string
      enum:
        - STATIC
        - DYNAMIC
      default: STATIC

    ClientPerformanceFeeConfig:
      type: object
      additionalProperties: false
      required:
        - rate
      properties:
        rate:
          type: number
          minimum: 0
          maximum: 1
          description: Performance fee percentage as a decimal (e.g. 0.01 for 1%)
        hwm_mode:
          $ref: '#/components/schemas/HighWaterMarkMode'
          default: STATIC
          description: >
            STATIC uses the configured high_water_mark. DYNAMIC derives the high-water mark as
            the maximum published index level through two calculation days before the fee
            reference date, and charges no fee until that history exists.
        high_water_mark:
          type: number
          description: Required when hwm_mode is STATIC. Must be omitted when hwm_mode is DYNAMIC.

    ClientManagementFeeConfig:
      type: object
      additionalProperties: false
      required:
        - rate
        - day_count_convention
      properties:
        rate:
          type: number
          minimum: 0
          maximum: 1
          description: Management fee percentage as a decimal (e.g. 0.01 for 1%)
        day_count_convention:
          $ref: '#/components/schemas/DayCountConvention'
          description: Management fee day-count convention

    ClientUnifiedFeeConfig:
      type: object
      additionalProperties: false
      required:
        - deduction_source
      properties:
        deduction_source:
          $ref: '#/components/schemas/FeeDeductionSource'
          description: Where configured fees should be deducted from
        performance_fee:
          $ref: '#/components/schemas/ClientPerformanceFeeConfig'
          description: Optional high-water-mark performance fee configuration
        management_fee:
          $ref: '#/components/schemas/ClientManagementFeeConfig'
          description: Optional time-accrued management fee configuration

    ClientMultiEBSpecific:
      type: object
      additionalProperties: false
      properties:
        corporate_actions:
          $ref: '#/components/schemas/ClientEBCoraxConfig'
          # this is how you get pydantic to output a good default:
          default_factory: ClientEBCoraxConfig
        level_overrides:
          description: optional level overrides for the index on certain days.
          type: array
          items:
            $ref: '#/components/schemas/LevelOverride'
          example:
            - date: '2022-03-18'
              level: 1364.344
              comment: test for some special day for some special reason
        tick_configuration:
          description: config for the intraday index ticking start/end hour/minutes
          $ref: '#/components/schemas/TickConfiguration'
        rebal_freq:
          $ref: '#/components/schemas/RebalFrequency'
        precision_level:
          description: used to set the rounding decimal field when creating identifiers
          type: integer
          minimum: 0
        dissemination_settings:
          description: array of configurations for setting up identifiers for individual providers
          type: array
          items:
            $ref: '#/components/schemas/DisseminationSetting'
        unified_fee_config:
          $ref: '#/components/schemas/ClientUnifiedFeeConfig'
          description: Optional unified fee configuration for multi-asset equity baskets

    DisseminationSetting:
      description: configuration for setting up identifier to provider
      type: object
      additionalProperties: false
      required:
        - destination
        - ticker
      properties:
        destination:
          type: string
          enum:
            - BLOOMBERG
            - REFINITIV
            - MORNINGSTAR
            - FACTSET
        ticker:
          type: string

    TickConfiguration:
      description: configuration for intraday index ticking time information
      type: object
      additionalProperties: false
      properties:
        intraday_timezone:
          type: string
          default: US/Eastern
          example: US/Eastern
        tick_start_hour:
          type: integer
          description: hour the index will start ticking intraday
          minimum: 0
          maximum: 23
        tick_start_minute:
          type: integer
          description: minute the index will start ticking intraday
          minimum: 0
          maximum: 59
        tick_end_hour:
          type: integer
          description: hour the index will end ticking intraday
          minimum: 0
          maximum: 23
        tick_end_minute:
          type: integer
          description: minute the index will end ticking intraday
          minimum: 0
          maximum: 59

    ClientRuntimeInfo:
      description: represents index runtime info, which must be specified for some indices (but auto derived for others based on exchange close times etc)
      type: object
      additionalProperties: false
      required:
        - run_hour
        - run_minute
      properties:
        run_hour:
          type: integer
          description: set to the hour of day to run the index in the index's timezone
          example: 16
        run_minute:
          type: integer
          description: 'set to the minute of the hour to run the index '
          example: 30
        timezone:
          type: string
          description: set to the timezone of the index
          default: US/Eastern
          example: US/Eastern

    ClientMultiEBPortUpdate:
      type: object
      title: ClientMultiEBPortUpdate
      additionalProperties: false
      required:
        - constituents
      properties:
        constituents:
          type: array
          items:
            $ref: '#/components/schemas/DatedValidEquityBasketPosition'
          description: The EB portfolio directory
          example:
            - date: '2022-03-11'
              identifier_type: RIC
              identifier: AAPL.OQ
              quantity: -0.2512355
              security_type: EQUITY
            - date: '2022-03-11'
              identifier_type: RIC
              identifier: USD
              quantity: 60.0
              security_type: CASH
          default_factory: list
        unit_of_measure:
          $ref: '#/components/schemas/PortfolioUom'
          default: SHARES
        index_currency:
          type: string


    ClientMultiEBPortConfig:
      allOf:
        # initial includes base date/val, then all the constituents. updates dont need base
        - $ref: '#/components/schemas/ClientMultiEBPortUpdate'
        - $ref: '#/components/schemas/ClientBaseVal'

    IdTransactionCost:
      type: object
      additionalProperties: false
      required:
        - merq_id
      properties:
        merq_id:
          type: string
          description: >
            Deterministic identifier. Two allowed shapes:
            1) fsym_id+country_code form:  el:<fsym_id>:<country_code>:0
            2) ticker: in:<ticker>:0
            Examples: 'el:R85KLC:US:0', 'in:AAPL:0'
          examples:
            - el:R85KLC:US:0
            - in:AAPL:0
        cost_floor:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 1.0
        vol_factor:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 1.0

    TransactionCostsConfig:
      type: object
      additionalProperties: false
      properties:
        transaction_cost_activated:
          type: boolean
          default: false
        pool_cash:
          type: boolean
          default: false
        individual_transaction_cost:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IdTransactionCost'

    ClientBufferSpecific:
      type: object
      additionalProperties: false
      description: properties specific to buffer indices
      required:
        - protection_start
        - protection_end
        - roll_freq
        - root
      properties:
        protection_start:
          description: losses on the underlying are incurred up to protection_start, the portfolio is protected against losses between protection_start and protection_end, and then losses after protection_end are also incurred. These are represented as percentages of the underlying. Eg on start=95 and end=70 (sometimes a called a 5/30 buffer), the first 5% of losses are incurred, the portfolio is protected between -5% and -30%, then losses after 30% are added to 5% and are incurred. In this example, if the underlying drops 32%, the index will lose 7%.
          type: number
          minimum: 0
          maximum: 100.0
          example: 95.0
        protection_end:
          description: eg the 30 in the above example. Must be < protection_start.
          type: number
          minimum: 0.0
          maximum: 100.0
          example: 70.0
        roll_freq:
          description: frequency in months of the options roll
          type: integer
          minimum: 1
          example: 3
          default: 12
        root:
          description: the root of the options
          type: string
          enum:
            - SPY
            - QQQ
            - IWM
            - EFA
            - EEM
            - TLT
            - LQD
            - HYG
            - GLD
          example: SPY

    OptionRoot:
      type: string
      enum:
        - SPY
        - QQQ
        - IWM
        - EFA
        - EEM
        - TLT
        - LQD
        - HYG
        - GLD

    ClientOptionStrategiesBase:
      description: A options strategy index
      type: object
      additionalProperties: false
      required:
        - strategy_type
        - underliers
        - strategy_options
      properties:
        strategy_type:
          description: The type of strategy
          $ref: '#/components/schemas/OptionStrategyType'
        underliers:
          description: The underlying assets of the strategy
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/FsymAndCountry'
              - $ref: '#/components/schemas/IndexTicker'
        strategy_options:
          description: List of options in the strategy and their configs
          type: array
          items:
            $ref: '#/components/schemas/ClientStrategyOption'
        hold_underlier:
          type: boolean
          default: true
        interest_rate_config:
          description: configuration for interest rates on an options strategy self service index
          $ref: '#/components/schemas/IndexInterestRateConfig'
        early_exercise:
          $ref: '#/components/schemas/ClientStrategyOptionEarlyExercise'
        transaction_cost_spec:
          $ref: '#/components/schemas/TransactionCostsConfig'

    ClientSingleOptionBase:
      description: a single option strategy
      type: object
      additionalProperties: false
      required:
        - rebalancing_strategy
        - exposure
      properties:
        rebalancing_strategy:
          description: the rebalancing schedule
          type: string
          enum:
            - weekly_Monday
            - weekly_Tuesday
            - weekly_Wednesday
            - weekly_Thursday
            - weekly_Friday
            - monthly_End_Of_Month
            - monthly_3rd_Friday
        root:
          description: the root of the option; more roots may be supported in the future
          $ref: '#/components/schemas/OptionRoot'
          default: SPY
          example: SPY
        option_underlying:
          description: the underlying option to use; if not specified the default is to use the `root`
          $ref: '#/components/schemas/OptionRoot'
          example: SPY
        exposure:
          description: percentage of the underlying you want exposure to
          type: number
          minimum: 0.0

    IndexInterestRateConfig:
      description: configuration for an index's interest rates including both lending/borrowing rates
      type: object
      additionalProperties: false
      required:
        - lending_rate
        - borrowing_rate
      properties:
        lending_rate:
          $ref: '#/components/schemas/InterestRateConfig'
        borrowing_rate:
          $ref: '#/components/schemas/InterestRateConfig'

    InterestRateConfig:
      description: configuration for an interest rate
      type: object
      additionalProperties: false
      oneOf:
        - $ref: '#/components/schemas/ConstantInterestRateConfig'
        - $ref: '#/components/schemas/VariableInterestRateConfig'
      discriminator:
        propertyName: type
        mapping:
          constant: '#/components/schemas/ConstantInterestRateConfig'
          variable: '#/components/schemas/VariableInterestRateConfig'

    ConstantInterestRateConfig:
      description: configuration for constant interest rates on options strategy self serve indices
      type: object
      additionalProperties: false
      required:
        - rate
      properties:
        rate:
          type: number

    VariableInterestRateConfig:
      description: configuration for variable interest rates on options strategy self serve indices
      type: object
      additionalProperties: false
      required:
        - reference_rate
        - spread
      properties:
        reference_rate:
          type: string
          enum:
            - SOFR
            - EFFR
        spread:
          type: number
        is_constant:
          type: boolean
          default: false
          description: Used to determine if the rate value is to be set once per rebalance period or changed every day

    # these models are split like this so that we get automatic validation / bounds for 'options' which depends on a 4-choice combo of two parameters
    # it looks repetetive, but structured like this, both the UI and the CLI will get instant validation of 'options' based on 'method' and 'options_method'
    # if instead we had just allowed the user to select "options, method, options_method", all these validation rules would be buried inside of the indexapi logic
    # and the UI would not offer any assistance

    ClientCoveredStrike:
      description: A covered strike strategy with the strike being percentage of the spot. Covers by selling a call.
      type: object
      additionalProperties: false
      required:
        - options
      properties:
        options:
          type: number
          minimum: 0.0
        method:
          type: string
          enum:
            - Covered
          default: Covered
          example: Covered
        options_method:
          type: string
          enum:
            - Strike
          default: Strike
          example: Strike

    ClientCoveredDelta:
      type: object
      additionalProperties: false
      description: A covered delta strategy with a call delta between 0 and 1. Covers by selling a call.
      required:
        - options
      properties:
        options:
          type: number
          minimum: 0.0
          maximum: 100.0
        method:
          type: string
          enum:
            - Covered
          default: Covered
          example: Covered
        options_method:
          type: string
          enum:
            - Delta
          default: Delta
          example: Delta

    ClientDownsideStrike:
      type: object
      additionalProperties: false
      description: A downside strike strategy with the strike being percentage of the spot. Protects downside by buying a put.
      required:
        - options
      properties:
        options:
          type: number
          minimum: 0.0
        method:
          type: string
          enum:
            - Downside
          default: Downside
          example: Downside
        options_method:
          type: string
          enum:
            - Strike
          default: Strike
          example: Strike

    ClientDownsideDelta:
      type: object
      additionalProperties: false
      description: A downside delta strategy with the delta being percentage of the spot. Protects downside by buying a put.
      required:
        - options
      properties:
        options:
          type: number
          minimum: -100.0
          maximum: 0
        method:
          type: string
          enum:
            - Downside
          default: Downside
          example: Downside
        options_method:
          type: string
          enum:
            - Delta
          default: Delta
          example: Delta

    OptionExerciseStyle:
      type: string
      enum:
        - EUROPEAN
        - AMERICAN

    ClientStrategyOption:
      type: object
      additionalProperties: false
      description: Defines an option in a strategy index for self service flow
      required:
        - option_type
        - trade_type
        - strike_type
        - exposure
        - number_of_tranches
        - expiry
        - rebalance
        - early_exercise
      properties:
        option_type:
          type: string
          $ref: '#/components/schemas/OptionType'
        trade_type:
          type: string
          $ref: '#/components/schemas/TradeType'
        strike_type:
          type: string
          $ref: '#/components/schemas/StrategyOptionStrikeType'
        strike_value:
          type: number
          minimum: 0
        exposure:
          type: number
          minimum: 0
        number_of_tranches:
          type: integer
          minimum: 1
        expiry:
          $ref: '#/components/schemas/ClientStrategyOptionExpiry'
        rebalance:
          oneOf:
            - $ref: '#/components/schemas/ClientStrategyOptionRebalanceRelativeToExpiry'
            - $ref: '#/components/schemas/ClientStrategyOptionRebalanceCertainDay'
        is_financing:
          type: boolean
          default: false
        is_spread:
          type: boolean
          default: false
        spread_lower_bound:
          type: number
        spread_upper_bound:
          type: number


    ClientStrategyOptionExpiry:
      type: object
      additionalProperties: false
      description: Defines expiry-related configs for options strategies self service flow
      required:
        - expiry_period_type
        - time_period_away
      properties:
        expiry_period_type:
          type: string
          $ref: '#/components/schemas/StrategyOptionExpiryPeriodType'
        time_period_away:
          type: integer
          minimum: 1
        day_of_week:
          type: string
          $ref: '#/components/schemas/DayOfWeek'
          description: Should only be set if expiry_time_period is WEEKLY

    EarlyExerciseTreatment:
      type: string
      enum:
        - KEEP_IN_CASH
        - RESTRIKE_AT_DAYS
        - CONDITION_RESTRIKE_AT_DAYS

    ClientStrategyOptionEarlyExercise:
      type: object
      additionalProperties: false
      description: Defines the Early Exercise Strategy
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          default: false
        treatment:
          $ref: '#/components/schemas/EarlyExerciseTreatment'
        restrike_days:
          type: integer
          minimum: 1
        borrowing_rate:
          type: number
          minimum: 0.0
        rebalancing_period:
          type: integer
          minimum: 1

    ClientStrategyOptionRebalanceRelativeToExpiry:
      type: object
      additionalProperties: false
      description: Defines rebalance-related configs for options strategies self service flow, if user selects "Relative to Expiry"
      required:
        - schedule_type
        - days_before_expiry
        - roll_back
      properties:
        schedule_type:
          type: string
          enum:
            - REL_TO_EXPIRY
        days_before_expiry:
