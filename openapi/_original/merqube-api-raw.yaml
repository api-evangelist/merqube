        roll_back:
          type: boolean
          description: Whether or not to roll back or roll forward if date is a holiday



    # full client models


    # Self Service Option Strategies Models

    ClientOptionStrategiesConfig:
      description: A Option strategies index
      title: ClientOptionStrategiesConfig
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/ClientOptionStrategiesBase'
