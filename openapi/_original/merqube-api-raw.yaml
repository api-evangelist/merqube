  # parameters

    MerqTimestamp:
      # https://www.regextester.com/109110
      # https://json-schema.org/understanding-json-schema/reference/string.html#dates-and-times
      # json schema does not support milliseconds!
      # hence we use a custom regex to capture prov_ts with ms
      anyOf:
        - type: string
          format: date-time
        - type: string
          format: date
        - type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(?:[ T][0-9]{2}:[0-9]{2}:[0-9]{2})?(?:[.][0-9]{1,6})?$
      example:
        - '2021-01-01'
        - '2021-01-01T01:01:01'
        - 2021-01-01T01:01:01.zzzzz

    Status:
      type: object
      required:
        - last_modified
      properties:
        created_at:
          type: string
        created_by:
          type: string
        last_modified:
          type: string
        last_modified_by:
          type: string
        locked_after:
          type: string
          format: date-time
          description: If this is set (non null), the manifest is locked for all edits to any other field after this timestamp. A PUT/PATCH may be used to first unlock the manifest, by setting this field (to a max of one hour in the future), or to `null` again, to make other edits.

    calendar_identifiers:
      type: object
      properties:
        calendar_identifiers:
          type: array
          items:
            type: string
            pattern: ^(FUT|MIC|FX|SM|MQI|OVERLAY):.+$

    holidays_to_add:
      type: object
      properties:
        holidays_to_add:
          type: array
          items:
            type: string
            format: date

    NestedCalendarSchema:
      type: object
      additionalProperties: false
      required:
        - operator
        - children
      properties:
        operator:
          type: string
          enum:
            - union
            - intersection
            - difference
        weekmask:
          type: array
          items:
            type: string
            enum:
              - Mon
              - Tue
              - Wed
              - Thu
              - Fri
              - Sat
              - Sun
            description: weekmask of valid business days
            default:
              - Mon
              - Tue
              - Wed
              - Thu
              - Fri
        children:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/calendar_identifiers'
              - $ref: '#/components/schemas/holidays_to_add'
              - $ref: '#/components/schemas/NestedCalendarSchema'

    FlatCalendarSchema:
      type: object
      additionalProperties: false
      properties:
        calendar_identifiers:
          type: array
          items:
            type: string
            pattern: ^(FUT|MIC|FX|SM|MQI|OVERLAY):.+$
          default_factory: list
        swaps_monitor_codes:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z]{3}$
          default_factory: list
        condition:
          type: string
          enum:
            - any
            - all
            - custom
          default: all
        holidays_to_add:
          type: array
          items:
            type: string
            format: date
          default_factory: list
        holidays_to_remove:
          type: array
          items:
            type: string
            format: date
          default_factory: list
        weekmask:
          type: array
          items:
            type: string
            enum:
              - Mon
              - Tue
              - Wed
              - Thu
              - Fri
              - Sat
              - Sun
          description: weekmask of valid business days
          default:
            - Mon
            - Tue
            - Wed
            - Thu
            - Fri

    HolidayCalendarSpec:
      anyOf:
        - $ref: '#/components/schemas/FlatCalendarSchema'
        - $ref: '#/components/schemas/NestedCalendarSchema'

    ArgumentsOrEnvVars:
      type: array
      items:
        type: array
        items:
          type: string

    SubPod:
      type: object
      additionalProperties: false
      properties:
        arguments:
          $ref: '#/components/schemas/ArgumentsOrEnvVars'
        command:
          type: string
        pod_type:
          type: string
        uuid:
          type: string
        env_vars:
          $ref: '#/components/schemas/ArgumentsOrEnvVars'
        pod_kwargs:
          type: object
          aditionalProperties: true
          properties:
            name:
              type: string
      required:
        - command
        - pod_type
        - uuid

    S3Bucket:
      type: object
      additionalProperties: false
      properties:
        bucket:
          type: string
        path:
          type: string
      required:
        - bucket

    AirflowConfig:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: A short description related with the generated runner
        s3_location:
          $ref: '#/components/schemas/S3Bucket'
          description: Bucket and path where the generated dag should be stored. If not defined `merq-airflow-dags-airflow2` is defined in merqutil
        dag:
          type: object
          additionalProperties: true
          description: use this to set kwargs for the dag
        pod:
          type: object
          additionalProperties: true
          description: use this to set kwargs for the pod
        env:
          type: object
          additionalProperties: true
          description: use this to set ENV variables in the pod
        affinity_match_expression_key:
          type: string
          description: the affinity to use in airflow
        subpods:
          type: array
          items:
            $ref: '#/components/schemas/SubPod'

    DisseminationDestinations:
      type: object
      properties:
        email_dissapi_configs:
          type: array
          items:
            type: object
            required:
              - recipient_list
              - subject
            properties:
              recipient_list:
                type: array
                items:
                  type: string
                minItems: 1
              email_list:
                type: array
                items:
                  type: string
              bcc_list:
                type: array
                items:
                  type: string
              cc_list:
                type: array
                items:
                  type: string
              subject:
                type: string
              content:
                type: string
              file_keys:
                type: array
                items:
                  type: string
          minItems: 1
        sftp_dissapi_configs:
          type: array
          items:
            type: object
            required:
              - sftp_ids
              - file_keys
            properties:
              sftp_ids:
                type: array
                items:
                  type: string
              file_keys:
                type: array
                items:
                  type: string
        s3_dissapi_configs:
          type: array
          items:
            type: object
            required:
              - bucket
              - key_prefix
              - file_keys
            properties:
              bucket:
                type: string
              key_prefix:
                type: string
              file_keys:
                type: array
                items:
                  type: string

    IndexReport:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
        program_args:
          type: object
        task_id:
          type: string
        dissemination_destinations:
          $ref: '#/components/schemas/DisseminationDestinations'

    RunConfig:
      type: object
      additionalProperties: true
      required:
        - schedule
        - job_enabled
        - num_days_to_load
      properties:
        airflow_config:
          $ref: '#/components/schemas/AirflowConfig'
        command:
          type: string
        command_arguments:
          $ref: '#/components/schemas/ArgumentsOrEnvVars'
        index_report_uuids:
          type: array
          items:
            type: string
        index_reports:
          oneOf:
            - type: array
              items:
                type: string
              minItems: 1
            - type: array
              items:
                $ref: '#/components/schemas/IndexReport'
        job_enabled:
          type: boolean
        holiday_calendar:
          $ref: '#/components/schemas/HolidayCalendarSpec'
        pod_image_and_tag:
          type: string
          description: overrides the image
        schedule:
          $ref: '#/components/schemas/Schedule'
        alert_priority:
          type: string
          enum:
            - P1
            - P2
            - P3
            - P4
            - P5
        tzinfo:
          type: string
        num_days_to_load:
          type: integer
        day_chunk_size:
          type: integer
          description: if set to a number, the index run will be split into chunks of this number of days
        state_key:
          type: string
          minLength: 1
          description: ID to use when storing or reading the state of an instance of a dissapi object.
        dqms:
          $ref: '#/components/schemas/DqmsConfig'


    RunConfigLabelAdditional:
      type: object
      description: used when there needs to be different run configurations, each with a different label, such as 'initial' vs 'final'
      required:
        - label
      properties:
        label:
          type: string
          description: unique label of this rc

    RunConfigLabel:
      type: object
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/RunConfig'
        - $ref: '#/components/schemas/RunConfigLabelAdditional'

    DqmsConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: If true, force-enables DQMS validation for this index

    Schedule:
      type: object
      additionalProperties: false
      properties:
        retries:
          type: integer
        retry_interval_min:
          type: integer
        schedule_start:
          type: string
        schedule_cron:
          type: string
        timeout_delta:
          type: string
          example: minutes=17
        business_days_prior:
          type: integer
          example: 1
        holiday_calendar:
          type: object
          properties:
            cal_type:
              type: string
              example: MIC
            mic:
              type: string
              example: XNYS
        triggers:
          type: array
          description: the dataset trigger to which the dag subscribes to. This is a list of trigger(s)
          items:
            type: string
          example:
            - trigger://exchange/XNYS/early_closing.merq
        event_driven:
          type: boolean
          default: false
          description: if true, there will be no defined schedule for the DAG (as in you could have a created DAG that won't run unless triggered manually)

      required:
        - retries
        - retry_interval_min
        - schedule_start

    CopyFromManifest:
      type: object
      description: Creates a new resource by starting from an existing resource, removing the id/status, adding/updating/deleting keys, then posting it as a new resource. The original resource is hereby referred to as the from-manifest. This is essentially a GET-MODIFY-POST operation. Only top level keys can be modifed/replaced/deleted, this does not support subkey modification.
      required:
        - copy_from_uuid
        - name
      properties:
        copy_from_uuid:
          type: string
          description: the uuid of the resource to start from
        field_deletes:
          type: array
          description: fields to delete from the from-manifest
          items:
            type: string
        field_updates:
          type: object
          description: a dictionary of top level keys that the original manifest will be updated with (ie `manifest.update(this[field_updates])`. Top level keys can be added or replaced. To change the namespace, add namespace to the field_updates dict. The new manifest must be valid per the original resource definition.
        name:
          type: string
          description: the name of the new resource

    # On POST, status is illegal. Subsequently, its always there and required on patch/put. Same with ID.
    CrudExtra:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - namespace
      properties:
        id:
          type: string
        namespace:
          type: string
        status:
