          type: object

    SecurityListPost:
      description: represents a list of securities
      type: object
      additionalProperties: false
      required:
        - name
        - securities
      properties:
        name:
          description: unique name among all other security lists
          type: string
          # reserved URL chars: https://developers.google.com/maps/url-encoding
          pattern: ^[^!*'() ;:@&=+$,/?%#\[\]]
        namespace:
          type: string
        realtime:
          type: boolean
        securities:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - security_type
              - identifier_type
              - identifier_value
            properties:
              identifier_type:
                type: string
                enum:
                  - RIC
                  - secapi_name
              identifier_value:
                type: string
                example: AAPL.QQ
              security_type:
                type: string
                example: equity

    SecurityListPatchPutGet:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/SecurityListPost'
        - $ref: '#/components/schemas/CrudExtra'


    # very old - from 2020, not sure if even accurate
    # TODO this doesnt seem like its used anymore?
    OptionResponse:
      type: object
      title: Option Response Schema
      properties:
        price:
          type: number
          format: number
          description: Option Price
        vol:
          type: number
          format: number
          description: Implied Volatility
        interest_rate:
          type: number
          format: number
          description: Implied Interest Rate
        dividend_yield:
          type: number
          format: number
          description: Implied Dividend Yield for the underlying
        spot:
          type: number
          format: number
          description: Underlying spot price
        delta:
          type: number
          format: number
          description: Delta of this option
        theta:
          type: number
          format: number
          description: Theta of the option being priced
        gamma:
          type: number
          format: number
          description: Gamma of the option being priced
        vega:
          type: number
          format: number
          description: Vega of the option being priced
        bid_ask_spread:
          type: number
          format: number
          description: Spread between Bid and Ask prices of the option being priced
        request_id:
          type: string
          description: Request ID sent in the request
      x-examples: {}
    DefinedOutcomeSolverRequest:
      type: object
      title: Client Defined Outcome Option Price Solver Response Schema
      additionalProperties: false
      required:
        - expiry
        - options
        - root
      properties:
        expiry:
          type: object
          $ref: '#/components/schemas/ClientDefinedOutcomeExpiry'
        root:
          type: string
          $ref: '#/components/schemas/ClientDefinedOutcomeRoots'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ClientDefinedOutcomeOption'
        variable_leg_strategy:
          type: object
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/ClientDefinedOutcomeParticipationRateStrategy'
            - $ref: '#/components/schemas/ClientDefinedOutcomeNoEtfStrategy'
            - $ref: '#/components/schemas/ClientDefinedOutcomeCashStrategy'
          discriminator:
            propertyName: strategy
            mapping:
              PARTICIPATION_RATE: '#/components/schemas/ClientDefinedOutcomeParticipationRateStrategy'
              NO_ETF: '#/components/schemas/ClientDefinedOutcomeNoEtfStrategy'
              CASH: '#/components/schemas/ClientDefinedOutcomeCashStrategy'
          description: The variable leg strategy to use. If not specified, defaults to Cap strategy.
        variable_leg_params:
          nullable: true
          $ref: '#/components/schemas/ClientDefinedOutcomeOption'
          description: User-defined option parameters for Participation Rate strategy

    DefinedOutcomeSolverResponse:
      type: object
      title: Client Defined Outcome Option Price Solver Response Schema
      additionalProperties: false
      properties:
        option_solutions:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/OptionPriceMetrics'
              - type:
          description: Option Price Metrics
        variable_leg_solution:
          type: object
          allOf:
            - oneOf:
                - $ref: '#/components/schemas/ClientDefinedOutcomeOption'
                - type:
            - properties:
                price:
                  type: number
                  format: number
                  description: Option Price
              required:
                - price
          description: Variable Leg Metrics
        variable_leg_cash_solution:
          type: number
          format: float
          nullable: true
          description: Cash solution when Cash strategy is selected

    OptionPriceMetrics:
      type: object
      title: Option Price Metrics Schema
      required:
        - price
        - vol
        - interest_rate
        - dividend_yield
        - spot
        - delta
        - theta
        - gamma
        - vega
        - bid_ask_spread
      additionalProperties: false
      description: Option Price Metrics
      example:
        price: 0.01
        vol: 0.2
        interest_rate: 0.01
        dividend_yield: 0.02
        spot: 100.0
        delta: 0.5
        theta: -0.01
        gamma: 0.1
        vega: 0.2
        bid_ask_spread: 0.01
      properties:
        price:
          type: number
          format: number
          description: Option Price
        vol:
          type: number
          format: number
          description: Implied Volatility
        interest_rate:
          type: number
          format: number
          description: Implied Interest Rate
        dividend_yield:
          type: number
          format: number
          description: Implied Dividend Yield for the underlying
        spot:
          type: number
          format: number
          description: Underlying spot price
        delta:
          type: number
          format: number
          description: Delta of this option
        theta:
          type: number
          format: number
          description: Theta of the option being priced
        gamma:
          type: number
          format: number
          description: Gamma of the option being priced
        vega:
          type: number
          format: number
          description: Vega of the option being priced
        bid_ask_spread:
          type: number
          format: number
          description: Spread between Bid and Ask prices of the option being priced

    FindStrikeResponse:
      type: object
      title: Find Strike Response Schema
      properties:
        strike:
          type: number
          format: number
          description: Strike that prices to the given budget.
        spot:
          type: number
          format: number
          description: Underlying spot price.
        strike_percentage:
          type: number
          format: number
          description: Strike as a percentage of the underlying spot price that prices to the given budget.
        request_id:
          type: string
          description: Request ID sent in the request

    Deadline:
      type: object
      additionalProperties: false
      required:
        - time_of_day
      # required here means they will always be populated in the pydantic model (they have defaults), not that they are required by the user
      # if you dont put these as required, pydantic thinks these can be "None"
        - deadline_type
        - next_day
        - og_priority
        - business_days_prior
      properties:
        time_of_day:
          type: string
          description: the time of day of the deadline
          pattern: ^(?:[01]\d|2[0-3]):(?:[0-5]\d):(?:[0-5]\d)$
        deadline_type:
          type: string
          enum:
            # TODO: can add more
            - calculation
            - restatement
          default: calculation
        next_day:
          description: set this to true if the index starts running on day T but the deadline does not pass until T+1 in that index timezone
          type: boolean
          default: false
        og_priority:
          type: string
          default: P1
          enum:
            - P1
            - P2
            - P3
        business_days_prior:
          type: integer
          description: the amount of days before T to check for data existence
          default: 0
        metrics:
          type: array
          items:
            type: string
          description: the list of metrics to check in the deadline checker script

    Metrics:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: iso8601 format
        metrics:
          $ref: '#/components/schemas/MetricsArr'

    MetricsArr:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: price_return
          value:
            type: number
            example: 1000.0000000000002

    Stats:
      properties:
        annual_volatility:
          type: number
          example: 3.717606464173326
        annualized_return:
          type: number
          example: 6.665050717276233
        cumulative_return:
          type: number
          example: 2.7597506251556547
        id:
          type: string
          example: YTD
        max_drawdown:
          type: number
          example: -1.3877029296510448
        sharpe_ratio:
          type: number
          example: 1.759543308780235
        start_date:
          $ref: '#/components/schemas/MerqTimestamp'
        end_date:
          $ref: '#/components/schemas/MerqTimestamp'

    MetricsDef:
      type: object
      properties:
        name:
          type: string
          example: daily_return
        type:
          type: string
          example: double

    ErrorCodes:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    IsoTS:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}(T|\s)\d{2}:\d{2}:\d{2}(\.\d{6})?$
      example: 2022-01-02T01:02:03

    IsoDate:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}
      example: 2000-01-04

    BaseDate:
      description: the date that the index has level 'base_value'
      type: string
      pattern: ^[0-9]{4}[-/][0-9]{2}[-/][0-9]{2}
      example: 2000-01-04

    IntradayTickFilter:
      description: Filter for tick events, used to configure when an rtindex should process ticks or send ticks to targets
      type: object
      additionalProperties: false
      properties:
        start_date:
          $ref: '#/components/schemas/MerqTimestamp'
        end_date:
          $ref: '#/components/schemas/MerqTimestamp'
        start_time:
          description: Inclusive start time of the day to start running this intraday index. Format is %H:%M:%S.%f. This should be in the timezone of the index based on tzinfo.
          type: string
          example: 20:39:00.262345
        end_time:
          description: Inclusive end time of the day to stop running this intraday index. Format is %H:%M:%S.%f. This should be in the timezone of the index based on tzinfo.
          type: string
          example: 20:39:00.262345
        days_of_week:
          description: Which days of the week to run the index. Each day of the week is denoted by an integer with Monday = 0 and Sunday = 6
          type: array
          items:
            type: integer
        exclude_holidays:
          description: If this is true use the index holiday calendar to decide which days to run the index. It will only run on non-holidays.
          type: boolean

    IntradayInfraTimedScaling:
      description: Describes how to scale up and down based on the active time range.
      type: object
      additionalProperties: false
      properties:
        enabled:
          description: Whether or not the deployment will be scaled up and down.
          type: boolean
          default: true
        start_time_buffer:
          description: The amount of minutes before the start time from which the deployment is scale up.
          type: integer
          default: 59
          minimum: 10
          maximum: 59
        end_time_buffer:
          description: The amount of minutes past the end time after which the deployment is scaled down.
          type: integer
          default: 10
          minimum: 5
          maximum: 59

    IntradayPublishConfigTargetBase:
      type: object
      properties:
        active_time_ranges:
          description: Time ranges during which values should be published to this target. Target level active_time_ranges override publish_config metric level active_time_ranges.
          type: array
          items:
            $ref: '#/components/schemas/IntradayTickFilter'

    IntradayPublishConfigDbTarget:
      allOf:
        - $ref: '#/components/schemas/IntradayPublishConfigTargetBase'
        - type: object
          properties:
            target:
              type: string
              enum:
                - db
          required:
            - target

    IntradayPublishConfigSecapiTarget:
      allOf:
        - $ref: '#/components/schemas/IntradayPublishConfigTargetBase'
        - type: object
          properties:
            target:
              type: string
              enum:
                - secapi
          required:
            - target

    IntradayPublishConfigBloombergTargetParams:
      type: object
      additionalProperties: false
      properties:
        rounding_decimals:
          type: integer
        ticker:
          type: string

    IntradayPublishConfigBloombergTarget:
      allOf:
        - $ref: '#/components/schemas/IntradayPublishConfigTargetBase'
        - type: object
          properties:
            target:
              type: string
              enum:
                - bloomberg
            params:
              $ref: '#/components/schemas/IntradayPublishConfigBloombergTargetParams'
          required:
            - target

    IntradayPublishConfigReutersTargetParams:
      type: object
      additionalProperties: false
      properties:
        rounding_decimals:
          type: integer
        ticker:
          type: string
        post_type:
          $ref: '#/components/schemas/ReutersProviderKwargsPostType'

    IntradayPublishConfigReutersTarget:
      allOf:
        - $ref: '#/components/schemas/IntradayPublishConfigTargetBase'
        - type: object
          properties:
            target:
              type: string
              enum:
                - reuters
            params:
              $ref: '#/components/schemas/IntradayPublishConfigReutersTargetParams'
          required:
            - target

    IntradayPublishConfig:
      description: Mapping of index metric to targets it should be sent to
      type: object
      additionalProperties:
        type: array
        items:
          oneOf:
            - $ref: '#/components/schemas/IntradayPublishConfigDbTarget'
            - $ref: '#/components/schemas/IntradayPublishConfigSecapiTarget'
            - $ref: '#/components/schemas/IntradayPublishConfigBloombergTarget'
            - $ref: '#/components/schemas/IntradayPublishConfigReutersTarget'

    RunState:
      type: object
      required:
        - status
      properties:
        status:
          # title gets used to generate the pydantic model class name
          $ref: '#/components/schemas/RunStateStatus'
        calculation_start_ts:
          description: set to the start of the last calculation, if the status is not PENDING_CREATION (has not ever started)
          $ref: '#/components/schemas/IsoTS'
        error:
          type: string
          description: An error message if status is FAILED

    RunStateStatus:
      description: the state of the last index run, if applicable
      type: string
      enum:
        - PENDING_CREATION
        - SUCCEEDED
        - FAILED
        - RUNNING

    FsymAndCountry:
      description: Represents the combination of a FSYM + Country Code
      type: object
      required:
        - fsym_id
        - country_code
      properties:
        fsym_id:
          type: string
        country_code:
          $ref: '#/components/schemas/CountryCode'

    IndexTicker:
      description: Represents a ticker of the index. Used in self service options to hold the Index as the underlier
      type: object
      required:
        - ticker
      properties:
        ticker:
          type: string
          enum:
            - NDX
            - SPX
            - RUT
            # Add more as needed
            - MQ5C
            - SXXP
            - SX5E



    # client indices

    ClientTemplateResponse:
      type: object
      properties:
        post_template:
          description: a full index manifest that can be posted
          $ref: '#/components/schemas/IndexDefinitionPost'
        bbg_ident_template:
          description: only returned if the client specified a bbg ticker
          $ref: '#/components/schemas/IdentifierUUIDPost'
          nullable: true
        target_ports:
          description: only returns for indices where the client should post the target portfolios
          type: array
          items:
            $ref: '#/components/schemas/BasketPortfolioPutIn'
          nullable: true

    ClientBaseVal:
      type: object
      additionalProperties: false
      required:
        - base_date
        - base_value
      properties:
        base_date:
          $ref: '#/components/schemas/BaseDate'
        base_value:
          type: number
          exclusiveMinimum: 0
          description: set the index value on base_date to this base_value
          example: 1000.0

    ClientOptionalBaseVal:
      type: object
      additionalProperties: false
      required:
        - base_value
      properties:
        base_date:
          $ref: '#/components/schemas/BaseDate'
        base_value:
          type: number
          exclusiveMinimum: 0
          description: set the index value on base_date to this base_value
          example: 1000.0

    ClientIndexBaseProperties:
      type: object
      additionalProperties: false
      required:
        - description
        - name
        - namespace
        - title
      properties:
        bbg_ticker:
          type: string
          description: due to the limitations of the Bloomberg ticker creation process (no API), this must be a pre-created ticker. You can email MerQube a list of tickers to create on your behalf at support@merqube.com. Then, you provide those as input to these indices
          example: MY_TICKER
        description:
          type: string
          description: set to the description of the index, which will show on merqube.com
          example: My Index Description
        email_list:
          type: array
          description: list of emails to send daily dissemination reports, and the initial backtest reports, to; if not specified, no emails will be sent
          items:
            type: string
          default_factory: list
          example:
            - bob@mycompany.com
            - alice@mycompany.com
        name:
          type: string
          description: 'set to the name of the index. Commonly people use the ticker as the name, but that is not necessary. Must be globally unique - you will get a 409 if this index name is taken '
          example: My Index
          # reserved URL chars: https://developers.google.com/maps/url-encoding
          pattern: ^[^!*'() ;:@&=+$,/?%#\[\]]
        namespace:
          type: string
          description: set to the namespace of the index
          example: mycompany
        title:
          type: string
          description: set to the title of the index that shows up on merqube.com
          example: My Index Title

    ClientIndexConfigBase:
      allOf:
        - $ref: '#/components/schemas/ClientBaseVal'
        - $ref: '#/components/schemas/ClientIndexBaseProperties'

    ClientIndexConfigOptionalBaseDate:
      allOf:
        - $ref: '#/components/schemas/ClientOptionalBaseVal'
        - $ref: '#/components/schemas/ClientIndexBaseProperties'

    ClientEquityBasketConfigBase:
      allOf:
        - $ref: '#/components/schemas/ClientIndexConfigBase'
        - type: object
          additionalProperties: false
          description: class with shared properties among the equity basket group.
          properties:
            currency:
              type: string
              description: set to the currency of the index
              default: USD
              example: USD
            holiday_calendar:
              $ref: '#/components/schemas/HolidayCalendarSpec'
            is_intraday:
              type: boolean
              description: set to true if the index is to calculate multiple times during the day. This does not pertain to the frequency of rebalancing; see `rebal_freq`. Even though theoretically all index family types can calculate multiple times a day, not all types will support this initially. This parameter is a bit experimental in that sense.
              default: false
              example: false

    ClientEquityIndexConfigBase:
      allOf:
        - $ref: '#/components/schemas/ClientIndexConfigOptionalBaseDate'
        - type: object
          additionalProperties: false
          description: class with shared properties among the equity index group.
          properties:
            currency:
              type: string
              description: set to the currency of the index
              default: USD
              example: USD
            holiday_calendar:
              $ref: '#/components/schemas/HolidayCalendarSpec'
            is_intraday:
              type: boolean
              description: set to true if the index is to calculate multiple times during the day. This does not pertain to the frequency of rebalancing; see `rebal_freq`. Even though theoretically all index family types can calculate multiple times a day, not all types will support this initially. This parameter is a bit experimental in that sense.
              default: false
              example: false

    ReinvestmentTime:
      additionalProperties: false
      type: string
      description: set to the type of reinvestment to apply
      enum:
        - AT_OPEN
        - AT_CLOSE
      example: AT_OPEN
      default: AT_OPEN

    ReinvestmentType:
      additionalProperties: false
      type: string
      description: set to the type of reinvestment to apply
      enum:
        - INDEX
        - SECURITY
      example: INDEX
      default: INDEX

    RebalanceTypeWithNoConfig:
      additionalProperties: false
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - FIXED_WEIGHT
            - EQUAL_WEIGHT

    FreeFloatRebalanceConfig:
      additionalProperties: false
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - FREE_FLOAT
          default: FREE_FLOAT
        max_weight:
          type: number

    RebalanceMethodConfig:
      additionalProperties: false
      oneOf:
        - $ref: '#/components/schemas/FreeFloatRebalanceConfig'
        - $ref: '#/components/schemas/RebalanceTypeWithNoConfig'

    WeeklyRebalanceDates:
      additionalProperties: false
      required:
        - day
      type: object
      properties:
        day:
          type: string
          enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday

    WeeklyRebalanceDateConfig:
      additionalProperties: false
      allOf:
        - type: object
          required:
            - frequency
          properties:
            frequency:
              type: string
              enum:
                - WEEKLY
              default: WEEKLY
            roll_forward:
              type: boolean
              default: true
        - $ref: '#/components/schemas/WeeklyRebalanceDates'

    InitialMonthConfig:
      additionalProperties: false
      type: object
      required:
        - frequency
      properties:
        roll_forward:
          type: boolean
          default: true
        frequency:
          type: string
          pattern: ^(ANNUAL|QUARTERLY|SEMIANNUAL|MONTHLY)$
        starting_month:
          type: string
          enum:
            - January
            - February
            - March
            - April
            - May
            - June
            - July
            - August
            - September
            - October
            - November
            - December

    SimpleRebalanceDateConfigOptions:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/InitialMonthConfig'
        - type: object
          required:
            - method
          properties:
            method:
              type: string
              enum:
                - FIRST BUSINESS DAY
                - LAST BUSINESS DAY


    XthDayRebalanceDateConfig:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/InitialMonthConfig'
        - type: object
          required:
            - method
          properties:
            method:
              type: string
              enum:
                - XTH CALENDAR DAY
            xth_day:
              type: integer
              minimum: 1
              maximum: 31

    AdvancedRebalanceDateConfig:
      additionalProperties: false
      required:
        - method
        - xth_week
        - day
      allOf:
        - $ref: '#/components/schemas/InitialMonthConfig'
        - type: object
          properties:
            method:
              type: string
              enum:
                - ADVANCED
              default: ADVANCED
            xth_week:
              type: string
              enum:
                - First
                - Second
                - Third
                - Fourth
                - Last
            roll_forward:
              type: boolean
              default: true
        - $ref: '#/components/schemas/WeeklyRebalanceDates'


    PeriodicDateConfig:
      additionalProperties: false
      oneOf:
        - $ref: '#/components/schemas/WeeklyRebalanceDateConfig'
        - $ref: '#/components/schemas/AdvancedRebalanceDateConfig'
        - $ref: '#/components/schemas/SimpleRebalanceDateConfigOptions'
        - $ref: '#/components/schemas/XthDayRebalanceDateConfig'


    CalendarAlias:
      type: string
      enum:
        - default
        - Canada
        - Euronext Paris
        - Europe
        - US
        - Transatlantic
    LegacyStaticBasketCalendarConfig:
      type: object
