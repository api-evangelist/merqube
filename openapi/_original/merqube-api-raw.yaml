        holidays_to_add:
          type: array
          items:
            $ref: '#/components/schemas/IsoDate'
        holidays_to_remove:
          type: array
          items:
            $ref: '#/components/schemas/IsoDate'

    ClientStaticBasketSpecific:
      type: object
      additionalProperties: false
      required:
        - base_value
        - return_type
        - reinvestment_time
        - reinvestment_type
        - rebalance_config
        - constituents
        - apply_mcap_screen
      properties:
        base_value:
          type: number
        return_type:
          type: string
          enum:
            - total_return
            - price_return
            - net_total_return
        reinvestment_time:
          $ref: '#/components/schemas/ReinvestmentTime'
          default: AT_CLOSE
        reinvestment_type:
          $ref: '#/components/schemas/ReinvestmentType'
          default: INDEX
        rebalance_config:
          $ref: '#/components/schemas/RebalanceConfig'
        apply_mcap_screen:
          type: boolean
          description: set to true if the index should apply a 15% min market cap screen
          default: true
        restrict_base_date:
