relationships:
- from: Index
  to: TargetPortfolio
  type: has_many
  via: path nesting /index/{uuid}/target_portfolio, keyed by eff_ts
- from: Index
  to: TargetPortfolioHandler
  type: belongs_to
  via: portfolio_handler_id
- from: Index
  to: Identifier
  type: has_many
  via: identifiers[] (name + provider), and 'index/{uuid}/identifier/{provider}'
- from: Index
  to: IndexClass
  type: belongs_to
  via: index_class_uuid
- from: Index
  to: Security
  type: has_many
  via: >-
    Creation side effect - POST /index returns security_id (SecAPI type `index`) and
    intraday_security_id (SecAPI type `intraday_index`). The SDK Overview states the two securities
    share the index's name and namespace and are renamed in lockstep with it.
- from: Index
  to: Index
  type: references
  via: benchmark.ticker using the "MQI:<name>" form, to benchmark one index against another
- from: Index
  to: DataCollection
  type: has_many
  via: path nesting /index/{uuid}/data_collections
- from: Index
  to: RunState
  type: has_one
  via: path nesting /index/{uuid}/run_state
- from: Index
  to: IndexDocument
  type: has_many
  via: path nesting /index/{uuid}/documents and the documents property on the manifest
- from: Index
  to: IndexReport
  type: has_many
  via: run_configuration.index_report_uuids
- from: TargetPortfolio
  to: Security
  type: references
  via: >-
    Positions are polymorphic and each variant carries a different identifier scheme -
    RicEquityPosition (RIC), FsymEquityPosition (fsym_id), SecapiBasketPosition (SecAPI id),
    MerqubeIndexPosition (MerQube index), OptionPosition and FuturesPosition.
- from: SecurityList
  to: Security
  type: has_many
  via: securities[]
- from: Identifier
  to: Index
  type: belongs_to
  via: index_name
- from: TargetPortfolioHandler
  to: DisseminationDestinations
  type: has_one
  via: event_notification_config.diss_destinations (sftp_ids, vendor targets)
polymorphism:
  note: >-
    The heaviest modelling in this contract is positional polymorphism - a portfolio position is one
    of RicEquityPosition, FsymEquityPosition, SecapiBasketPosition, MerqubeIndexPosition,
    OptionPosition or FuturesPosition, each with its own identifier field, plus Dated* variants.
    There is no discriminator declared, so a client must branch on which identifier field is
    present rather than on a type tag.
  discriminator_declared: false
