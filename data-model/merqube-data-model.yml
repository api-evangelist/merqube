  - 'rebal_freq'
  - 'family'
  - 'index_class_uuid'
  - 'portfolio_handler_id'
  - 'identifiers'
  - 'intraday'
  - 'run_configuration'
  - 'calculation_check'
  - 'benchmark'
  - 'status'

- name: TargetPortfolio
  description: >-
    The set of constituents an index should rebalance into on a stated future effective date.
  schemas:
  - 'BasketPortfolio'
  - 'BasketPortfolioPutIn'
