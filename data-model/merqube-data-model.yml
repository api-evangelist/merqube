  - 'DatedBasketPosition'

  paths:
  - '/index/{uuid}/target_portfolio'
  - '/index/{uuid}/target_portfolio/{target_portfolio_uuid}'

  key_fields:
  - 'eff_ts'
  - 'positions'
  - 'external_id'

- name: TargetPortfolioHandler
  description: >-
    A reusable policy object controlling how target portfolios are selected, validated, locked and
    disseminated for the indices bound to it.
  schemas:
  - 'TargetPortfolioHandlerPost'
  - 'TargetPortfolioHandlerPatchPutGet'
  - 'TargetPortfolioHandlerNotificationConfig'

  paths:
  - '/target_portfolio_handler'
  - '/target_portfolio_handler/{uuid}'

  key_fields:
