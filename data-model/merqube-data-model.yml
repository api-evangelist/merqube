source: >-
  Derived from components.schemas and paths in https://api.merqube.com/api (OpenAPI 3.1,
  info.version 4.40.0); relationship semantics corroborated by
  https://github.com/merqube/merqube-client-lib/blob/main/docs/Overview.md
provider: MerQube
api: MerQube API
identifier_conventions:
  primary_key: uuid
  key_note: >-
    Every addressable resource is keyed by an opaque `id`/`uuid`. MerQube's own docs are explicit
    that ids are permanent and names are not - "the only way to 'change' the id of an object is to
    delete it, and make another with the same name" - so a UUID is the only safe stored reference.
  natural_key: (name, namespace)
  natural_key_note: >-
    `name` is unique across a resource type and `namespace` is the permissioning boundary. Both
    are mutable. Lookup by name is supported via ?name / ?names but should not be persisted.
  id_prefixes: none
  metadata_block:
    field: status
    fields:
    - 'created_at'
    - 'created_by'
    - 'last_modified'
    - 'last_modified_by'
    - 'locked_after'

    role: >-
      Doubles as an optimistic-concurrency token - it must be supplied on PUT/PATCH and the write is
      rejected if it does not match storage.
entities:
- name: Index
  description: >-
    An index manifest - a computation configured to run periodically and publish computed values,
    most often an index methodology producing a daily level.
  schemas:
  - 'IndexDefinitionPost'
  - 'IndexDefinitionPatchPutGet'
  - 'Index Manifest'
  - 'IndexSpec'

  paths:
  - '/index'
  - '/index/{uuid}'

  operations:
  - 'index'
  - 'index_uuid'
  - 'index_portfolio'
  - 'index_portfolio_allocations'
  - 'index_stats'
  - 'index_caps'

  key_fields:
