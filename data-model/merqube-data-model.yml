  - 'namespace'
  - 'auto_select'
  - 'selection_window'
  - 'validation_window'
  - 'validator_fn'
  - 'eod_final_portfolio_lock_enabled'
  - 'event_notification_config'

- name: Identifier
  description: >-
    A vendor dissemination ticker bound to an index - the row that makes an index appear on
    Bloomberg, Reuters, Morningstar, FactSet, Nasdaq or Wind.
  schemas:
  - 'IdentifierUUIDPost'
  - 'IdentifierUUIDPatchPutGet'
  - 'IdentifierUUIDRef'
  - 'BloombergProviderKwargs'
  - 'ReutersProviderKwargs'
  - 'NasdaqProviderKwargs'
  - 'SecapiProviderKwargs'

  paths:
  - '/identifier'
  - '/identifier/{provider}'
