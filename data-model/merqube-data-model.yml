  - 'namespace'
  - 'provider'
  - 'ticker'
  - 'metric'
  - 'index_name'
  - 'rounding_decimals'
  - 'provider_kwargs'
  - 'enabled'

- name: Security
  description: >-
    A SecAPI object holding time-series metrics. Types include index, intraday_index, futures_root
