domain_standards:
- id: iso-10383-mic
  name: ISO 10383 Market Identifier Codes
  conforms: true
  evidence: >-
    The contract types market venues as MIC codes, not as free text. components.schemas has a `mic`
    property with pattern "[A-Z0-9]{4}" titled "Mic Code" (examples XNYS, XCME); holiday calendars
    are addressed by an identifier grammar "^(FUT|MIC|FX|SM|MQI|OVERLAY):.+$" with cal_type "MIC";
    and an exchange filter object is typed {type: enum[mic], mics: [string]}. A counterparty that
    already speaks MIC needs no venue mapping table.
  location: components.schemas (mic, calendar_identifiers, NestedCalendarSchema, exchange filters)
- id: iso-3166-1-alpha-2
  name: ISO 3166-1 alpha-2 country codes
  conforms: true
  evidence: >-
    components.schemas.CountryCode is described as "ISO country codes" and enumerates two-letter
    alpha-2 values (AE, AR, AT ... US, ZA) used on the options availability path
    /options/availability_dates/{fysm_id}/{country_code}.
  location: components.schemas.CountryCode
  defect: >-
    The enum contains a JSON `false` where "NO" (Norway) should be - the source YAML was written
    unquoted and YAML 1.1 coerced NO to a boolean. It is present in both the resolved JSON at
    /api and the raw YAML at /api-raw, so Norway is currently unrepresentable in this enum and any
    generated client will emit a boolean member. Quoting "NO" in the source fixes it.
- id: iso-8601
  name: ISO 8601 date and date-time
  conforms: true
  evidence: >-
    components.schemas.MerqTimestamp accepts format date-time, format date, and an explicit
    "^[0-9]{4}-[0-9]{2}-[0-9]{2}(?:[ T][0-9]{2}:[0-9]{2}:[0-9]{2})?(?:[.][0-9]{1,6})?$" pattern;
    IsoTS and IsoDate schemas are named for the standard.
  location: components.schemas.MerqTimestamp / IsoTS / IsoDate
- id: iso-4217
  name: ISO 4217 currency codes
  conforms: partial
  evidence: >-
    The index manifest carries a `currency` property but types it as a bare string with no enum and
    no pattern, so the standard is used by convention (live data shows EUR, USD) rather than
    enforced by the contract.
  location: components.schemas.IndexDefinitionPost.currency
- id: fix-protocol
  conforms: false
  evidence: >-
    No FIX tags, sessions or message types. MerQube is an index calculation and administration
    surface, not an order-routing one; FIX is listed on the securities_market_data regime but is not
    applicable to this product.
- id: iso-20022
  conforms: false
  evidence: No ISO 20022 message types or namespaces anywhere in the contract.
- id: mifid-ii
  conforms: unknown
  evidence: >-
    No MiFID II claim is made in any machine-readable artifact or in the API docs. MerQube does run
    a formal benchmark-governance process - published announcements, methodology consultations and
    policies at https://merqube.com/governance - which is the operational shape a regulated
    benchmark administrator maintains, but no authorisation, registration number or regime is
    asserted on a page this pipeline could read, so nothing is claimed here.
