provider: MerQube
api: MerQube API
cross_cutting:
- id: openapi
  conforms: true
  version: 3.1.0
  evidence: >-
    openapi "3.1.0" at the root of https://api.merqube.com/api, 53 paths / 76 operations /
    252 component schemas. Served unauthenticated from the API host itself and named as the
    canonical spec in MerQube's own SDK Overview.
- id: json-schema
  conforms: true
  version: 2020-12
  evidence: >-
    OpenAPI 3.1 dialect; components.schemas uses 2020-12 constructs throughout (anyOf/oneOf/allOf,
    pattern, prefix-free $ref). MerQube generates its pydantic client types directly from this
    document via bin/generate_types.sh.
- id: rest
  conforms: true
  evidence: >-
    Resource-oriented paths with the full standard verb set (GET/POST/PUT/PATCH/DELETE) across
    /index, /identifier, /security, /security_list, /target_portfolio_handler.
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme in the contract and no OAuth flow in the docs. Authentication is an API
    key in an Authorization header with an "APIKEY " prefix. (The index manifest does mention OAuth
    token emails in administrative.client fields, but that refers to MerQube's own internal console
    identity, not to an API authorization flow available to callers.)
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on api.merqube.com.
- id: rfc9457
  conforms: false
  evidence: >-
    No application/problem+json anywhere. 4xx responses declare a description string and no body
    schema or media type at all. See errors/merqube-problem-types.yml.
- id: rfc8594-deprecation
  conforms: false
  evidence: >-
    No Deprecation or Sunset response header observed and none declared. There IS an in-band
    `deprecation_warnings` array in the response envelope, but it is undocumented and not the RFC
    mechanism.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header. MerQube instead ships optimistic concurrency (a `status`
    compare-and-set block required on PUT/PATCH) and 409-on-duplicate-name for creates. See
    conventions/merqube-conventions.yml.
- id: pagination
  conforms: true
  style: page-number
  evidence: >-
    components.parameters.pageParam (default 1, minimum 1) and pageSizeParam (default 1000,
    minimum 1). No next-link or total-count field in the response envelope.
- id: cors
  conforms: partial
  evidence: >-
    Live responses from api.merqube.com carry access-control-allow-origin
    https://internal.api.merqube.com - a single origin, and MerQube's own internal one. Browser
    callers from any other origin are not permitted.
- id: rate-limit-headers
  conforms: false
  evidence: No RateLimit-*, X-RateLimit-* or Retry-After header on any observed response.
- id: scim
  conforms: false
  evidence: No SCIM schema URN and no user-provisioning surface in the contract.
- id: odata
  conforms: false
