content_negotiation:
  request: application/json
  response: application/json
  alternatives:
  - format=csv query parameter on collection reads
  - multipart upload on PUT /index-documents
reversibility:
  grade: documented
  applies: true
  read_only: false
  summary: >-
    Every write surface has an inverse operation published in the contract - DELETE for each
    created resource, PUT/PATCH to restore a previous manifest, and a documented unlock path. What
    MerQube does NOT publish anywhere is a WINDOW: no retention period, no undelete, no grace
    period, and no statement of what happens to an index's history when the index is deleted. That
    is why this grades `documented` and not `verified`.
  surfaces:
  - write: POST /index
    reversal: DELETE /index/{uuid}
    operation_id: null
    window: null
    window_source: null
    note: >-
      Deletion is by UUID. The SDK Overview states ids are permanent and that "the only way to
      'change' the id of an object is to delete it, and make another with the same name" - deletion
      is therefore destructive of the identifier, and no restore path is published.
  - write: PUT /index/{uuid}
    reversal: PUT /index/{uuid} with the prior manifest
    operation_id: null
    window: null
    window_source: null
    note: >-
      Reversal is a re-PUT of the previous manifest, guarded by the `status` compare-and-set block.
      MerQube does not publish manifest version history, so the caller must have kept the prior copy.
  - write: PATCH /index/{uuid}
    reversal: PATCH /index/{uuid} with the prior field values
    window: null
    window_source: null
  - write: PUT /index/{uuid}/target_portfolio
    reversal: DELETE /index/{uuid}/target_portfolio/{target_portfolio_uuid}
    window: >-
      Effective only before the index has computed that date. MerQube's docs state "Make sure to
      create a TargetPortfolio for date T before the index has computed date T. TargetPortfolios
      with dates in the past will be ignored."
    window_source: https://merqube.stoplight.io/docs/api/p6s6m4p35ehfv-authentication
    note: >-
      This is the one write on the API with a stated boundary, and it is a computation cutoff rather
      than a retention window. Uploads are keyed on `eff_ts`: re-PUT with the same eff_ts replaces
      the portfolio for that timestamp, which is itself the reversal mechanism.
  - write: POST /identifier/{provider}
    reversal: DELETE /identifier/{provider}/{uuid}
    window: null
    window_source: null
  - write: POST /security/{type}
    reversal: DELETE /security/{type}/{secid}
    window: null
    window_source: null
  - write: POST /security/{type}/data
    reversal: POST /security/{type}/data/delete
    window: null
    window_source: null
    note: An explicit inverse endpoint for uploaded metric data.
  - write: POST /security_list
    reversal: DELETE /security_list/{uuid}
    window: null
    window_source: null
  - write: POST /target_portfolio_handler
    reversal: DELETE /target_portfolio_handler/{uuid}
    window: null
    window_source: null
  - write: PUT /index-documents
    reversal: DELETE /index-documents
    window: null
    window_source: null
  gaps:
  - No retention or undelete window is stated for any DELETE.
  - No dry-run / preview mode on any write operation.
  - No documented effect of index deletion on the two SecAPI securities it auto-creates.
dry_run_mode:
  supported: false
  note: >-
    No preview, validate-only or dry-run parameter exists on any write. The closest surface is the
    POST /helper/index-template/* family, which returns a generated index manifest WITHOUT creating
    it - a caller can render and inspect a definition before POSTing it to /index. That is a
    templating aid, not a dry-run of the write itself.
