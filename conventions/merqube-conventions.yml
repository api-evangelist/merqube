- name: prefer_read_replica
  in: query
  default: false
  description: >-
    Opt into replica/cache-tolerant reads. Defaults to false, which keeps DB reads on the writer and
    bypasses SecAPI full-query caches for stronger read-after-write consistency. This is an
    explicit, documented consistency control - unusually good practice for an agent that must read
    its own write.
response_envelope:
  shape: >-
    Collection reads return a JSON object with `results` (array), `error_codes` (array of
    {code,message}) and, observed live, `deprecation_warnings` (array) and `linked_resources`
    (object). Errors on 4xx/5xx are described in the contract by `description` only - no response
    body schema and no media type is declared for any error status.
  fields:
  - results
  - error_codes
  - deprecation_warnings
  - linked_resources
  rfc9457: false
  detail: see errors/merqube-problem-types.yml
request_id_tracing:
  header: x-request-id
  direction: response
  observed: '2026-08-25'
  example_source: GET https://api.merqube.com/index
  documented: false
  note: >-
    Every response observed carried an `x-request-id`. It is a real, usable correlation id for
    support, but it is not mentioned anywhere in the OpenAPI or the docs.
idempotency:
  supported: false
  idempotency_key_header: null
  note: >-
    MerQube publishes no Idempotency-Key header and no request-replay semantics. What it does
    publish is OPTIMISTIC CONCURRENCY: every object carries a `status` block (created_at, created_by,
    last_modified, last_modified_by) which must be supplied on PUT or PATCH, and the write is only
    accepted if the block matches the copy in storage. That prevents lost updates on a stale copy;
    it does not make a retried POST safe. POST /index and POST /security/{type} return 409 on
    duplicate name, which makes create effectively name-idempotent by rejection rather than by
    replay.
  concurrency_control:
    mechanism: status-block compare-and-set
    field: status
    applies_to: [PUT, PATCH]
    source: https://github.com/merqube/merqube-client-lib/blob/main/docs/Overview.md
  duplicate_protection:
    mechanism: uniqueness on (name, namespace) enforced with HTTP 409
    applies_to:
    - POST /index
    - POST /security/{type}
locking:
  field: status.locked_after
  description: >-
    When `status.locked_after` is set on an index manifest, the manifest is locked against all edits
    to any other field after that timestamp. A PUT or PATCH may first unlock it by setting the field
    (to at most one hour in the future) or back to null, then make other edits.
  source: components.schemas.Status in https://api.merqube.com/api
versioning:
  scheme: semver-in-contract
  current_version: 4.40.0
  transport: none
  detail: >-
    info.version in the OpenAPI is 4.40.0, but there is no version segment in any path, no version
    header, and no media-type versioning. Callers cannot pin a version; the only version signal is
    the number in the spec document itself.
  deprecation_signal:
    field: deprecation_warnings
    location: response body (top level)
    observed_empty: true
    note: >-
      The live envelope reserves a `deprecation_warnings` array. It was empty on every call
      observed. No RFC 8594 Deprecation or Sunset response header was seen.
rate_limit_signaling:
  headers_published: false
  headers_observed: []
  status_on_exhaustion: null
  detail: see rate-limits/merqube-rate-limits.yml - no limits are documented and no RateLimit-*,
