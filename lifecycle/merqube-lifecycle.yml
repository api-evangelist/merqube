    published.
run_state:
  endpoint: GET /index/{uuid}/run_state
  helper: GET /helper/index/run-states
  statuses:
  - PENDING_CREATION
  - SUCCEEDED
  - FAILED
  - RUNNING
  note: >-
    Per-index calculation lifecycle is fully observable through the API, including an `error` string
    when status is FAILED. This is the operational health surface MerQube ships in place of a
    status page.
