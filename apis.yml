apis:
- name: MerQube API
  description: >-
    Public REST API covering the MerQube IndexAPI (index manifests, target portfolios, index
    documents, identifiers, portfolio handlers, index templating helpers and run state) and the
    SecAPI (security metrics, index levels, portfolios, statistics, security lists and options
    pricing). Authenticated with an API key sent as `Authorization: APIKEY <key>`; unauthenticated
    callers see only resources in the world-readable `default` namespace.
