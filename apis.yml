aid: merqube
name: MerQube
description: >-
  MerQube is an index technology company that designs, calculates and administers rules-based
  investment strategies and custom indices for banks, asset managers and ETF issuers. Its
  cloud-native platform is API-first: the public MerQube API (api.merqube.com) exposes an IndexAPI
  for creating, editing, running and deleting index manifests, target portfolios, index documents
  and identifiers, and a SecAPI for retrieving security metrics, index levels, portfolios and
  statistics across equities, futures, options and MerQube indices. The company publishes a
  link-resolved OpenAPI 3.1 description from the API host itself, a browsable rendering at
  merqube.com/api, a Stoplight documentation portal, and a first-party Apache-2.0 Python client
  library on PyPI and GitHub.
