write_tools_deliberately_excluded:
  note: >-
    POST/PUT/PATCH/DELETE on /index, /identifier, /security, /security_list and
    /target_portfolio_handler create and destroy production index configurations that disseminate to
    Bloomberg and Reuters. They are omitted from this candidate list on purpose: no reversal window
    is published (see conventions/merqube-conventions.yml reversibility) and there is no dry-run
    mode, so an autonomous agent has no safe way to undo them.
